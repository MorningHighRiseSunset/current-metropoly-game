<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Royale Baccarat social preview</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; margin: 0; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 47% 53%;
        background: radial-gradient(circle at 18% 18%, rgba(203, 151, 30, .17), transparent 30%), #07140d;
        color: #f7f3e8;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .copy { padding: 58px 42px 48px 70px; display: flex; flex-direction: column; }
      .mark {
        width: 58px; height: 58px; display: grid; place-items: center;
        border-radius: 50%; background: #d49c18; color: #07140d;
        font: 800 29px Georgia, serif;
      }
      .eyebrow {
        margin: 45px 0 12px; color: #e3b63c; font-size: 17px;
        font-weight: 800; letter-spacing: .17em; text-transform: uppercase;
      }
      h1 { margin: 0; font: 700 70px/.91 Georgia, serif; letter-spacing: -.035em; }
      p { max-width: 470px; margin: 23px 0 0; color: #c1cbc3; font-size: 22px; line-height: 1.45; }
      .tags { display: flex; gap: 10px; margin-top: auto; }
      .tags span {
        padding: 9px 13px; border: 1px solid rgba(227, 182, 60, .38);
        border-radius: 999px; color: #e8d69f; font-size: 14px; font-weight: 750;
      }
      .visual {
        position: relative; margin: 34px 0; overflow: hidden;
        border: 1px solid rgba(227, 182, 60, .35); border-right: 0;
        border-radius: 22px 0 0 22px; box-shadow: -24px 30px 80px rgba(0, 0, 0, .42);
      }
      .visual img { width: 100%; height: 100%; object-fit: cover; object-position: 42% top; }
      .visual::after {
        content: "REAL GAMEPLAY"; position: absolute; right: 26px; bottom: 24px;
        padding: 8px 12px; border-radius: 999px; background: rgba(4, 12, 8, .82);
        color: #e3b63c; font-size: 12px; font-weight: 800; letter-spacing: .12em;
      }
    </style>
  </head>
  <body>
    <section class="copy">
      <div class="mark">R</div>
      <div class="eyebrow">Free · Local · No account</div>
      <h1>Royale<br>Baccarat</h1>
      <p>No-commission Baccarat with correct draw rules, side bets, hand history, and live P&amp;L.</p>
      <div class="tags"><span>Super 6</span><span>5 bet types</span><span>Open source</span></div>
    </section>
    <section class="visual">
      <img src="royale-baccarat-preview.png" alt="Royale Baccarat game table">
    </section>
  </body>
</html>
