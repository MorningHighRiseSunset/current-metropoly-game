<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baccarat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }
        
        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(155, 89, 182, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(142, 68, 173, 0.15) 0%, transparent 50%);
            animation: pulseBackground 8s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes pulseBackground {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .baccarat-container {
            width: 100%;
            max-width: 700px;
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        /* Casino Table Layout */
        .casino-table {
            background: linear-gradient(135deg, #1a472a 0%, #0d2b1a 100%);
            border: 8px solid #8b5cf6;
            border-radius: 30px;
            padding: 40px 30px;
            margin: 20px 0;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5), inset 0 0 80px rgba(0,0,0,0.3);
            position: relative;
        }
        
        .casino-table::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(45deg, transparent, transparent 15px, rgba(255,255,255,0.02) 15px, rgba(255,255,255,0.02) 30px);
            pointer-events: none;
            border-radius: 22px;
        }

        .table-layout {
            display: flex;
            flex-direction: column;
            gap: 30px;
            position: relative;
            z-index: 1;
        }

        .hand-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            border: 2px solid rgba(139, 92, 246, 0.3);
        }

        .hand-label {
            font-size: 1.3em;
            color: #a78bfa;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
            min-width: 120px;
            text-align: left;
        }

        .hand {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex: 1;
            min-height: 100px;
        }

        .score-display {
            font-size: 1.4em;
            color: #a78bfa;
            font-weight: bold;
            min-width: 80px;
            text-align: right;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #9b59b6, #8e44ad, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(155, 89, 182, 0.5);
            animation: titleGlow 2s ease-in-out infinite;
            letter-spacing: 2px;
        }
        
        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.15), rgba(142, 68, 173, 0.15));
            border: 2px solid rgba(155, 89, 182, 0.4);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(155, 89, 182, 0.3);
        }
        
        .info-item {
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }
        
        .card {
            width: 60px;
            height: 90px;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 2px solid #8b5cf6;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #a78bfa;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .result {
            font-size: 1.5em;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.2), rgba(142, 68, 173, 0.2));
            border: 2px solid rgba(155, 89, 182, 0.5);
            border-radius: 15px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(155, 89, 182, 0.2);
            transition: all 0.3s ease;
        }
        
        .result.win {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.3), rgba(39, 174, 96, 0.3));
            border-color: #2ecc71;
            animation: resultWin 0.5s ease-out;
        }
        
        @keyframes resultWin {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .betting-options {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .bet-btn {
            padding: 12px 25px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .bet-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .bet-btn:hover::before {
            left: 100%;
        }
        
        .bet-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.5);
        }
        
        .bet-btn.selected {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(155, 89, 182, 0.6);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="baccarat-container">
        <h1>🎴 Baccarat</h1>
        
        <div class="game-info">
            <div class="info-item">💰 Balance: $<span id="money-display">2500</span></div>
            <div class="info-item">🎯 Current Bet: $<span id="current-bet-display">0</span></div>
        </div>

        <div class="betting-options">
            <button class="bet-btn" data-type="player">👤 Player (2x)</button>
            <button class="bet-btn" data-type="banker">🏦 Banker (1.95x)</button>
            <button class="bet-btn" data-type="tie">🤝 Tie (8x)</button>
        </div>

        <div class="casino-table">
            <div class="table-layout">
                <div class="hand-area">
                    <div class="hand-label">🤖 Banker</div>
                    <div class="hand" id="ai-cards"></div>
                    <div class="score-display">Score: <span id="ai-score">0</span></div>
                </div>

                <div class="hand-area">
                    <div class="hand-label">👤 Player</div>
                    <div class="hand" id="player-cards"></div>
                    <div class="score-display">Score: <span id="player-score">0</span></div>
                </div>
            </div>
        </div>

        <div class="result" id="result"></div>

        <div class="controls">
            <button class="btn" id="deal-btn">🎴 Deal ($100)</button>
        </div>
    </div>

    <script>
// Get balance from URL parameter or use default
function getBalanceFromURL() {
    const params = new URLSearchParams(window.location.search);
    return parseInt(params.get('balance')) || window.playerMoney || 2500;
}

// Check if loaded standalone (not in iframe)
const isStandalone = window === window.top;
if (isStandalone) {
  window.playerMoney = 2500;
  window.updateMainGameBalance = function(balance) {
    // No-op in standalone mode
  };
} else {
  window.playerMoney = getBalanceFromURL();
}
</script>
<script src="script.js"></script>
<script>
// Auto-initialize
document.addEventListener('DOMContentLoaded', function() {
    const container = document.querySelector('.baccarat-container');
    if (container && window.initBaccaratMinigame) {
        window.initBaccaratMinigame(container, window.playerMoney, window.updateMainGameBalance);
    }
});
</script>
</body>
</html>
