<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baccarat - Vegas Metropoly</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        body.iframe-mode {
            background: transparent;
            overflow: hidden;
            transform: scale(1.5);
            transform-origin: center center;
        }
    </style>
</head>
<body>
    <div class="baccarat-container"></div>
    <script src="script.js"></script>
    <script>
        // Detect if running in iframe
        function isInIframe() {
            try {
                return window.self !== window.top;
            } catch (e) {
                return true;
            }
        }

        // Get observer mode from URL parameter
        function isObserverMode() {
            const params = new URLSearchParams(window.location.search);
            return params.get('observer') === 'true';
        }

        // Auto-initialize for standalone usage only
        document.addEventListener('DOMContentLoaded', function() {
            // Add iframe mode class if needed
            if (isInIframe()) {
                document.body.classList.add('iframe-mode');
            }

            // Set observer mode flag for AI auto-play
            window.__isObserverMode = isObserverMode();

            // Only auto-initialize in standalone mode (not iframe)
            if (!isInIframe()) {
                const container = document.querySelector('.baccarat-container');
                if (container && window.initBaccaratMinigame) {
                    const balance = new URLSearchParams(window.location.search).get('balance') || 2500;
                    window.initBaccaratMinigame(container, parseInt(balance), null);
                }
            }
        });
    </script>
</body>
</html>
