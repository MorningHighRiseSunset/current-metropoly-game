<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baccarat - Vegas Metropoly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="baccarat-container"></div>
    <script src="script.js"></script>
    <script>
        // Auto-initialize for standalone usage
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.baccarat-container');
            if (container && window.initBaccaratMinigame) {
                const balance = new URLSearchParams(window.location.search).get('balance') || 2500;
                window.initBaccaratMinigame(container, parseInt(balance), null);
            }
        });
    </script>
</body>
</html>
