<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baccarat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }
        
        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(155, 89, 182, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(142, 68, 173, 0.15) 0%, transparent 50%);
            animation: pulseBackground 8s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes pulseBackground {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .baccarat-container {
            width: 100%;
            max-width: 550px;
            padding: 8px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        /* Professional Casino Baccarat Table - Half Circle (curved bottom) */
        .casino-table {
            background: linear-gradient(180deg, #1a472a 0%, #0d2b1a 100%);
            border: 8px solid #8B4513;
            border-radius: 0 0 200px 200px;
            padding: 40px 40px 30px 40px;
            margin: 8px 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 100px rgba(0,0,0,0.4);
            position: relative;
            min-height: 300px;
            max-width: 600px;
            overflow: hidden;
        }

        .casino-table::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.02) 20px, rgba(255,255,255,0.02) 40px);
            pointer-events: none;
            border-radius: 0 0 200px 200px;
        }

        .casino-table::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 0 0 185px 185px;
            pointer-events: none;
        }

        .table-layout {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 20px;
        }

        /* Betting areas with white lines - casino table style */
        .bet-area {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.6);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
        }

        .bet-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.05);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .bet-area:hover::before {
            opacity: 1;
        }

        .bet-area.selected {
            border-color: #FFD700;
            background: rgba(255,215,0,0.1);
        }

        .bet-area.selected::before {
            background: rgba(255,215,0,0.15);
            opacity: 1;
        }

        .bet-label {
            font-size: 0.8em;
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            position: relative;
            z-index: 1;
        }

        .bet-payout {
            font-size: 0.65em;
            color: #FFD700;
            margin-top: 2px;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }

        /* Position betting areas following curved table shape */
        .player-area-bet {
            left: 20px;
            top: 20px;
            width: 140px;
            height: 180px;
            border-radius: 10px 10px 180px 10px;
            padding: 15px;
        }

        .banker-area-bet {
            right: 20px;
            top: 20px;
            width: 140px;
            height: 180px;
            border-radius: 10px 10px 10px 180px;
            padding: 15px;
        }

        .tie-area-bet {
            left: 50%;
            top: 20px;
            transform: translateX(-50%);
            width: 80px;
            height: 60px;
            border-radius: 8px;
            padding: 12px;
        }

        .card-display-area {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .player-pair-bet {
            left: 20px;
            top: 210px;
            width: 140px;
            height: 50px;
            border-radius: 10px 10px 50px 10px;
            padding: 10px;
        }

        .banker-pair-bet {
            right: 20px;
            top: 210px;
            width: 140px;
            height: 50px;
            border-radius: 10px 10px 10px 50px;
            padding: 10px;
        }

        /* Card display area */
        .card-display-area {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        /* Banker area */
        .banker-area {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            margin: 0 auto;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
        }

        .banker-label {
            font-size: 1.2em;
            color: #a78bfa;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
            margin-right: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Player area */
        .player-area {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            margin: 0 auto;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
        }

        .player-label {
            font-size: 1.2em;
            color: #a78bfa;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
            margin-right: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hand {
            display: flex;
            justify-content: center;
            gap: 4px;
            flex: 1;
            min-height: 55px;
        }

        .score-display {
            font-size: 1.4em;
            color: #a78bfa;
            font-weight: bold;
            min-width: 80px;
            text-align: right;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }

        .status-area {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .status-message {
            font-size: 1.3em;
            color: #f0f0f0;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 15px rgba(155, 89, 182, 0.8);
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        
        h1 {
            font-size: 1.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #9b59b6, #8e44ad, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(155, 89, 182, 0.5);
            animation: titleGlow 2s ease-in-out infinite;
            letter-spacing: 2px;
        }
        
        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px 15px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.15), rgba(142, 68, 173, 0.15));
            border: 2px solid rgba(155, 89, 182, 0.4);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(155, 89, 182, 0.3);
        }
        
        .info-item {
            font-size: 1.1em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }
        
        .card {
            width: 28px;
            height: 40px;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 2px solid #8b5cf6;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #a78bfa;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .betting-options {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .bet-btn {
            padding: 8px 20px;
            font-size: 0.85em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .bet-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .bet-btn:hover::before {
            left: 100%;
        }
        
        .bet-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(155, 89, 182, 0.6);
        }
        
        .bet-btn.selected {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .btn {
            padding: 8px 25px;
            font-size: 0.9em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(155, 89, 182, 0.6);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="baccarat-container">
        <h1>Baccarat</h1>
        
        <div class="game-info">
            <div class="info-item">Balance: $<span id="money-display">2500</span></div>
            <div class="info-item">Current Bet: $<span id="current-bet-display">0</span></div>
        </div>

        <div class="casino-table">
            <div class="table-layout">
                <div class="bet-area player-area-bet" data-bet="player">
                    <span class="bet-label">PLAYER</span>
                    <span class="bet-payout">1:1</span>
                </div>
                <div class="bet-area banker-area-bet" data-bet="banker">
                    <span class="bet-label">BANKER</span>
                    <span class="bet-payout">1:1</span>
                </div>
                <div class="bet-area tie-area-bet" data-bet="tie">
                    <span class="bet-label">TIE</span>
                    <span class="bet-payout">8:1</span>
                </div>
                <div class="card-display-area">
                    <div class="banker-area">
                        <div class="banker-label">Banker</div>
                        <div class="hand" id="ai-cards"></div>
                        <div class="score-display" id="ai-score">0</div>
                    </div>
                    <div class="player-area">
                        <div class="player-label">Player</div>
                        <div class="hand" id="player-cards"></div>
                        <div class="score-display" id="player-score">0</div>
                    </div>
                </div>
                <div class="player-pair-bet bet-area" data-bet="player-pair">
                    <span class="bet-label">PLAYER PAIR</span>
                    <span class="bet-payout">11:1</span>
                </div>
                <div class="banker-pair-bet bet-area" data-bet="banker-pair">
                    <span class="bet-label">BANKER PAIR</span>
                    <span class="bet-payout">11:1</span>
                </div>
            </div>
        </div>

        <div class="status-area">
            <div class="status-message" id="status-message">Place your bet and click Deal</div>
        </div>

        <div class="controls">
            <button class="btn" id="deal-btn">🎴 Deal</button>
            <button class="btn" id="clear-btn">🗑️ Clear Bets</button>
        </div>

    </div>

    <script>
// Get balance from URL parameter or use default
function getBalanceFromURL() {
    const params = new URLSearchParams(window.location.search);
    return parseInt(params.get('balance')) || window.playerMoney || 2500;
}

// Check if loaded standalone (not in iframe)
const isStandalone = window === window.top;
if (isStandalone) {
  window.playerMoney = 2500;
  window.updateMainGameBalance = function(balance) {
    // No-op in standalone mode
  };
} else {
  window.playerMoney = getBalanceFromURL();
}
</script>
<script src="script.js"></script>
<script>
// Auto-initialize
document.addEventListener('DOMContentLoaded', function() {
    const container = document.querySelector('.baccarat-container');
    if (container && window.initBaccaratMinigame) {
        window.initBaccaratMinigame(container, window.playerMoney, window.updateMainGameBalance);
    }
});
</script>
</body>
</html>
