<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baccarat</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d0713;
            font-family: 'Georgia', serif;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-container img {
            max-width: 70%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }

        .image-container:hover img {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
<script>
// Initialize function for main game integration - defined immediately
window.initBaccaratMinigame = function(container, initialBalance, balanceCallback) {
    console.log('Baccarat image display loaded with balance:', initialBalance);
    window.__casinoBalance = initialBalance;
    window.playerBalance = initialBalance;
    if (balanceCallback) {
        window.balanceCallback = balanceCallback;
    }
};
</script>
    <div class="container">
        <div class="image-container">
            <img src="baccarat.jpg" alt="Baccarat Table">
        </div>
    </div>
</body>
</html>
