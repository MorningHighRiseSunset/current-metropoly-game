<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Test - Simple</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #2a2a2a;
            font-family: Arial, sans-serif;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 20px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 100;
        }
        button {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #0052a3;
        }
    </style>
</head>
<body>
    <div id="info">
        <div>Dice Test - Procedural Generation</div>
        <div id="status">Loading...</div>
    </div>
    <button onclick="rollDice()">Roll Dice</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="dice-glb-config.js"></script>
    
    <script>
        let scene, camera, renderer;
        let dice1Mesh, dice2Mesh;
        let diceRollAnimFrame = null;

        function createDiceTexture(value) {
            const size = 256;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.strokeRect(0, 0, size, size);

            ctx.fillStyle = '#000000';
            const pipRadius = size / 16;
            const pipPositions = {
                1: [[0.5, 0.5]],
                2: [[0.25, 0.25], [0.75, 0.75]],
                3: [[0.25, 0.25], [0.5, 0.5], [0.75, 0.75]],
                4: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]],
                5: [[0.25, 0.25], [0.75, 0.25], [0.5, 0.5], [0.25, 0.75], [0.75, 0.75]],
                6: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.5], [0.75, 0.5], [0.25, 0.75], [0.75, 0.75]]
            };

            const positions = pipPositions[value] || pipPositions[1];
            positions.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(x * size, y * size, pipRadius, 0, Math.PI * 2);
                ctx.fill();
            });

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        function createDiceMesh() {
            const size = 0.15 * DICE_GLB_CONFIG.scale;
            const geometry = new THREE.BoxGeometry(size, size, size);
            
            const materials = [
                new THREE.MeshLambertMaterial({ map: createDiceTexture(2) }),
                new THREE.MeshLambertMaterial({ map: createDiceTexture(5) }),
                new THREE.MeshLambertMaterial({ map: createDiceTexture(1) }),
                new THREE.MeshLambertMaterial({ map: createDiceTexture(6) }),
                new THREE.MeshLambertMaterial({ map: createDiceTexture(4) }),
                new THREE.MeshLambertMaterial({ map: createDiceTexture(3) })
            ];

            const dice = new THREE.Mesh(geometry, materials);
            dice.castShadow = true;
            dice.receiveShadow = true;
            return dice;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 2);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.debug.checkShaderErrors = false;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Board plane
            const planeGeometry = new THREE.PlaneGeometry(2, 2);
            const planeMaterial = new THREE.MeshLambertMaterial({ color: 0x2a6a2a });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true;
            scene.add(plane);

            // Create initial dice
            dice1Mesh = createDiceMesh();
            dice2Mesh = createDiceMesh();
            dice1Mesh.position.set(-0.1, 0.1, 0);
            dice2Mesh.position.set(0.1, 0.1, 0);
            scene.add(dice1Mesh);
            scene.add(dice2Mesh);

            updateStatus('Ready! Click "Roll Dice" to start.');
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function updateStatus(msg) {
            document.getElementById('status').innerHTML = msg;
        }

        function rollDice() {
            updateStatus('Rolling...');
            const dice1Value = Math.floor(Math.random() * 6) + 1;
            const dice2Value = Math.floor(Math.random() * 6) + 1;

            const anchor = { x: 0, y: 0.08, z: 0 };

            if (diceRollAnimFrame) {
                cancelAnimationFrame(diceRollAnimFrame);
                diceRollAnimFrame = null;
            }

            let rollTick = runDiceRollAnimation({
                meshes: [dice1Mesh, dice2Mesh],
                values: [dice1Value, dice2Value],
                duration: getDiceRollDurationMs(),
                anchor,
                onComplete: () => {
                    setTimeout(() => {
                        const total = dice1Value + dice2Value;
                        updateStatus(`Rolled: ${dice1Value} + ${dice2Value} = ${total}`);
                    }, getDiceSettleHoldMs());
                }
            });

            function animateDiceFrame(now) {
                if (rollTick && rollTick(now)) {
                    diceRollAnimFrame = requestAnimationFrame(animateDiceFrame);
                } else {
                    rollTick = null;
                    diceRollAnimFrame = null;
                }
            }

            diceRollAnimFrame = requestAnimationFrame(animateDiceFrame);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
