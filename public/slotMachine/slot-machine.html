<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slots</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050008;
      font-family: 'Orbitron', sans-serif;
      color: #e0d0ff;
      overflow: hidden;
      padding: 20px;
    }

    body.iframe-mode {
      padding: 0;
      min-height: auto;
      overflow: hidden;
      background: transparent;
    }

    body.iframe-mode .machine {
      max-width: 100%;
      padding: 15px;
    }

    .machine {
      max-width: 420px;
    }



    /* Subtle animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 40, 200, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(80, 20, 140, 0.2), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .machine {
      position: relative;
      z-index: 1;
      background: linear-gradient(165deg, #1a0a2e 0%, #0d0518 100%);
      border: 1px solid rgba(160, 80, 255, 0.35);
      border-radius: 28px;
      padding: 36px 42px 40px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.8),
        0 25px 50px -12px rgba(0, 0, 0, 0.7),
        0 0 80px -20px rgba(140, 60, 255, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      max-width: 480px;
      width: 100%;
      backdrop-filter: blur(8px);
    }

    /* Soft top accent line */
    .machine::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(180, 100, 255, 0.7), transparent);
    }

    .balance-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(140, 60, 255, 0.2);
      border-radius: 14px;
      padding: 14px 20px;
      margin-bottom: 28px;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    .balance-bar span {
      color: #c9a0ff;
      font-weight: 600;
    }

    .reels-container {
      display: flex;
      gap: 14px;
      justify-content: center;
      background: #030006;
      border: 1px solid rgba(120, 50, 200, 0.3);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    /* Soft glow behind reels */
    .reels-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(100, 40, 180, 0.12), transparent 70%);
      pointer-events: none;
    }

    .reel {
      width: 108px;
      height: 128px;
      background: linear-gradient(180deg, #160a28 0%, #0a0414 50%, #160a28 100%);
      border: 1px solid rgba(140, 70, 220, 0.35);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.6rem;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset 0 0 24px rgba(0, 0, 0, 0.85),
        0 0 12px rgba(100, 40, 180, 0.15);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .reel.win {
      border-color: rgba(200, 120, 255, 0.8);
      box-shadow:
        inset 0 0 24px rgba(0, 0, 0, 0.85),
        0 0 22px rgba(160, 80, 255, 0.5);
    }

    .reel .symbol {
      display: block;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s;
      filter: drop-shadow(0 0 6px rgba(180, 100, 255, 0.3));
      will-change: transform;
    }

    .reel.spinning .symbol {
      animation: spinBlur 0.07s linear infinite;
    }

    @keyframes spinBlur {
      0%   { transform: translateY(-28px) scale(0.92); opacity: 0.35; filter: blur(3px); }
      50%  { transform: translateY(0) scale(1); opacity: 1; filter: blur(0.5px); }
      100% { transform: translateY(28px) scale(0.92); opacity: 0.35; filter: blur(3px); }
    }

    /* Landing bounce */
    .reel.landing .symbol {
      animation: land 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes land {
      0%   { transform: translateY(-18px) scale(0.9); opacity: 0.6; }
      60%  { transform: translateY(4px) scale(1.08); }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .win-line {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 50%;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(200, 120, 255, 0.3) 15%,
        #d080ff 50%,
        rgba(200, 120, 255, 0.3) 85%,
        transparent 100%);
      transform: translateY(-50%) scaleX(0);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 0 18px rgba(180, 100, 255, 0.7);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s;
    }

    .win-line.active {
      transform: translateY(-50%) scaleX(1);
      opacity: 1;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }

    .bet-controls {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 0.9rem;
      letter-spacing: 1.5px;
      color: #a080c0;
      width: 100%;
      max-width: 280px;
    }

    .bet-slider-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bet-slider-container label {
      font-size: 0.75rem;
      color: #a080c0;
      letter-spacing: 1px;
    }

    .bet-slider {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(100, 40, 180, 0.3);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .bet-slider::-webkit-slider-runnable-track {
      background: rgba(100, 40, 180, 0.5);
      border-radius: 3px;
    }

    .bet-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(165deg, #a060ff, #7a40cc);
      border: 2px solid rgba(180, 120, 255, 0.6);
      cursor: pointer;
      box-shadow: 0 0 12px rgba(140, 60, 255, 0.4);
      transition: all 0.2s;
    }

    .bet-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 0 18px rgba(160, 80, 255, 0.6);
    }

    .bet-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(165deg, #a060ff, #7a40cc);
      border: 2px solid rgba(180, 120, 255, 0.6);
      cursor: pointer;
      box-shadow: 0 0 12px rgba(140, 60, 255, 0.4);
      transition: all 0.2s;
    }

    .bet-slider:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #bet-display {
      min-width: 48px;
      text-align: center;
      color: #d0b0ff;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .spin-btn {
      width: 170px;
      height: 54px;
      border: none;
      border-radius: 27px;
      background: linear-gradient(165deg, #7b3fe4 0%, #5a1fc0 50%, #4a18a0 100%);
      color: #f0e6ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 4px 0 #3a1080,
        0 8px 24px rgba(100, 40, 200, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.15s ease;
      text-transform: uppercase;
    }

    .spin-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      transition: left 0.5s;
    }

    .spin-btn:hover:not(:disabled)::before {
      left: 100%;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow:
        0 6px 0 #3a1080,
        0 12px 28px rgba(120, 50, 220, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .spin-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow:
        0 1px 0 #3a1080,
        0 4px 12px rgba(100, 40, 200, 0.3);
    }

    .spin-btn:disabled {
      background: linear-gradient(165deg, #2a1a3e, #1a0f28);
      box-shadow: 0 4px 0 #12081c;
      color: #6655aa;
      cursor: not-allowed;
    }

    .message {
      min-height: 28px;
      margin-top: 22px;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      letter-spacing: 1.5px;
      color: #9070b0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .message.win {
      color: #d0a0ff;
      text-shadow: 0 0 18px rgba(180, 100, 255, 0.6);
      transform: scale(1.05);
    }

    .message.lose {
      color: #7050a0;
    }

    .message.jackpot {
      color: #e8c0ff;
      font-size: 1.25rem;
      letter-spacing: 3px;
      text-shadow: 0 0 24px rgba(200, 120, 255, 0.8);
      animation: jackpotGlow 1.2s ease-in-out infinite alternate;
    }

    @keyframes jackpotGlow {
      from { text-shadow: 0 0 18px rgba(180, 100, 255, 0.5); transform: scale(1); }
      to   { text-shadow: 0 0 32px rgba(220, 140, 255, 0.9); transform: scale(1.06); }
    }

    /* Particle burst for wins */
    .particle {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c080ff;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 0 8px #c080ff;
    }
  </style>
</head>
<body>
  <div class="machine">
    <div class="balance-bar">
      <div>BALANCE <span id="balance">2500</span></div>
      <div>WIN <span id="last-win">0</span></div>
    </div>

    <div class="reels-container">
      <div class="win-line" id="win-line"></div>
      <div class="reel" id="reel1"><span class="symbol">🍒</span></div>
      <div class="reel" id="reel2"><span class="symbol">🍋</span></div>
      <div class="reel" id="reel3"><span class="symbol">🔔</span></div>
    </div>

    <div class="controls">
      <div class="bet-controls">
        <div class="bet-slider-container">
          <label>BET AMOUNT</label>
          <input type="range" id="bet-slider" class="bet-slider" min="5" max="1000" value="5" step="5">
        </div>
        <div>BET <span id="bet-display">5</span></div>
      </div>

      <button class="spin-btn" id="spin-btn">SPIN</button>
    </div>

    <div class="message" id="message">Ready</div>
  </div>

  <script>
    // Detect if running in iframe
    function isInIframe() {
      try {
        return window.self !== window.top;
      } catch (e) {
        return true;
      }
    }

    // Add iframe mode class if needed
    if (isInIframe()) {
      document.body.classList.add('iframe-mode');
    }

    const symbols = ['🍒', '🍋', '🍊', '🔔', '💎', '7️⃣'];
    const weights = [28, 24, 18, 14, 10, 6];

    let balance = window.parent?.playerMoney || 2500;
    let bet = 5;
    let spinning = false;
    let spinSound = null;
    let updateMainGameBalance = null;

    // Balance sync with parent window
    function syncBalanceToParent() {
      try {
        // Update local balance variables first
        window.__casinoBalance = balance;
        window.playerBalance = balance;

        // Use the main game's sync callback if available
        if (updateMainGameBalance) {
          updateMainGameBalance(balance);
        }

        // Also try to notify parent window via postMessage
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'BALANCE_UPDATE', balance }, '*');
        }
      } catch (e) {
        // Silent fail for balance sync errors
      }
    }

    // Listen for balance from parent window
    window.addEventListener('message', function(event) {
      if (event.data.type === 'SET_BALANCE') {
        balance = event.data.balance;
        updateUI();
      }
    });

    const balanceEl = document.getElementById('balance');
    const lastWinEl = document.getElementById('last-win');
    const betDisplay = document.getElementById('bet-display');
    const betSlider = document.getElementById('bet-slider');
    const messageEl = document.getElementById('message');
    const spinBtn = document.getElementById('spin-btn');
    const winLine = document.getElementById('win-line');
    const reels = [
      document.getElementById('reel1'),
      document.getElementById('reel2'),
      document.getElementById('reel3')
    ];

    function weightedRandom() {
      const r = Math.random() * 100;
      let cumulative = 0;
      for (let i = 0; i < weights.length; i++) {
        cumulative += weights[i];
        if (r < cumulative) return symbols[i];
      }
      return symbols[0];
    }

    function updateUI() {
      balanceEl.textContent = balance;
      betDisplay.textContent = bet;

      // Update slider max based on balance (max 1k)
      const maxBet = Math.min(1000, Math.max(5, balance));
      betSlider.max = maxBet;

      // Ensure bet doesn't exceed max or balance
      if (bet > maxBet) {
        bet = maxBet;
        betSlider.value = bet;
        betDisplay.textContent = bet;
      }

      // Ensure bet is a multiple of 5 (except if balance is less than 5)
      if (balance >= 5 && bet % 5 !== 0) {
        bet = Math.floor(bet / 5) * 5;
        if (bet < 5) bet = 5;
        betSlider.value = bet;
        betDisplay.textContent = bet;
      }

      betSlider.disabled = spinning;
      spinBtn.disabled = spinning || balance < bet;
    }

    function setMessage(text, type = '') {
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
    }

    function particleBurst(x, y, count = 18) {
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
        const dist = 40 + Math.random() * 90;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist - 30;
        const duration = 0.6 + Math.random() * 0.5;
        p.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.8, 0.3, 1), opacity ${duration}s ease-out`;
        document.body.appendChild(p);
        requestAnimationFrame(() => {
          p.style.transform = `translate(${tx}px, ${ty}px) scale(0)`;
          p.style.opacity = '0';
        });
        setTimeout(() => p.remove(), duration * 1000 + 50);
      }
    }

    function getPayout(results) {
      const [a, b, c] = results;
      if (a === b && b === c) {
        const multipliers = { '7️⃣': 50, '💎': 25, '🔔': 15, '🍊': 10, '🍋': 8, '🍒': 6 };
        return bet * (multipliers[a] || 5);
      }
      if (a === b || b === c || a === c) return bet * 2;
      return 0;
    }

    async function spin() {
      if (spinning || balance < bet) return;

      // Ensure bet is valid before spinning
      const maxBet = Math.min(1000, Math.max(5, balance));
      if (bet > maxBet) {
        bet = maxBet;
        betSlider.value = bet;
        betDisplay.textContent = bet;
      }

      spinning = true;
      balance -= bet;
      syncBalanceToParent(); // Sync bet deduction immediately
      lastWinEl.textContent = '0';
      winLine.classList.remove('active');
      reels.forEach(r => r.classList.remove('win', 'landing'));
      setMessage('…', '');
      updateUI();

      // Play spin sound
      if (!spinSound) {
        spinSound = new Audio('../Roulette/Sounds/spinopel-spinning-roulette-wheel-429832.mp3');
        spinSound.volume = 0.3;
      }
      spinSound.currentTime = 0;
      spinSound.play().catch(e => console.log('Audio play failed:', e));

      reels.forEach(r => r.classList.add('spinning'));

      const durations = [1100, 1500, 1900];
      const results = [];

      const spinPromises = reels.map((reel, i) => {
        return new Promise(resolve => {
          const interval = setInterval(() => {
            reel.querySelector('.symbol').textContent =
              symbols[Math.floor(Math.random() * symbols.length)];
          }, 60);

          setTimeout(() => {
            clearInterval(interval);
            const final = weightedRandom();
            results[i] = final;
            reel.querySelector('.symbol').textContent = final;
            reel.classList.remove('spinning');
            reel.classList.add('landing');
            resolve();
          }, durations[i]);
        });
      });

      await Promise.all(spinPromises);

      // small delay so landing animation can finish
      await new Promise(r => setTimeout(r, 200));

      const payout = getPayout(results);
      spinning = false;

      if (payout > 0) {
        balance += payout;
        syncBalanceToParent(); // Sync winnings
        lastWinEl.textContent = payout;
        winLine.classList.add('active');
        reels.forEach(r => r.classList.add('win'));

        // Clamp bet to new balance after win
        const maxBet = Math.min(1000, Math.max(5, balance));
        if (bet > maxBet) {
          bet = maxBet;
          betSlider.value = bet;
          betDisplay.textContent = bet;
        }

        const rect = document.querySelector('.reels-container').getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        if (results[0] === results[1] && results[1] === results[2]) {
          if (results[0] === '7️⃣' || results[0] === '💎') {
            setMessage(results[0] === '7️⃣' ? 'JACKPOT' : 'BIG WIN', 'jackpot');
            particleBurst(cx, cy, 28);
            setTimeout(() => particleBurst(cx, cy, 18), 200);
          } else {
            setMessage(`+${payout}`, 'win');
            particleBurst(cx, cy, 16);
          }
        } else {
          setMessage(`+${payout}`, 'win');
          particleBurst(cx, cy, 12);
        }
      } else {
        setMessage('—', 'lose');
      }

      updateUI();

      if (balance < 1) {
        setTimeout(() => setMessage('Refresh to restart', 'lose'), 1200);
      }
    }

    spinBtn.addEventListener('click', spin);

    // Slider input handler
    betSlider.addEventListener('input', (e) => {
      let newBet = parseInt(e.target.value, 10);

      // Clamp to valid range
      const maxBet = Math.min(1000, Math.max(5, balance));
      newBet = Math.max(5, Math.min(newBet, maxBet));

      // Ensure bet is a multiple of 5
      newBet = Math.floor(newBet / 5) * 5;
      if (newBet < 5) newBet = 5;

      betSlider.value = newBet;
      bet = newBet;
      betDisplay.textContent = bet;
      updateUI();
    });

    document.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        spin();
      }
    });

    // Expose balance for parent window to read
    window.__casinoBalance = balance;
    window.playerBalance = balance;

    // Minigame initialization function for main game integration
    window.initSlotsMinigame = function(container, initialBalance, syncCasinoBalance) {
      // Update balance with main game's balance
      balance = typeof initialBalance === 'number' ? initialBalance : 2500;
      updateMainGameBalance = typeof syncCasinoBalance === 'function' ? syncCasinoBalance : null;

      // Expose balance for main game to read
      window.__casinoBalance = balance;
      window.playerBalance = balance;

      // Update UI with new balance
      updateUI();
    };

    // Alias for main game compatibility
    window.initSlotMachine = window.initSlotsMinigame;

    updateUI();
  </script>
</body>
</html>
