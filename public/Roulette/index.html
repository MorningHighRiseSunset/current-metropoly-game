<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .roulette-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #c0392b;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(192, 57, 43, 0.1);
            border: 1px solid rgba(192, 57, 43, 0.3);
            border-radius: 12px;
        }
        .info-item {
            font-size: 1.2em;
            font-weight: bold;
        }
        .wheel-container {
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border-radius: 50%;
            border: 8px solid #c0392b;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
        }
        .wheel {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: conic-gradient(
                #c0392b 0deg 10deg, #2c3e50 10deg 20deg,
                #c0392b 20deg 30deg, #2c3e50 30deg 40deg,
                #c0392b 40deg 50deg, #2c3e50 50deg 60deg,
                #c0392b 60deg 70deg, #2c3e50 70deg 80deg,
                #c0392b 80deg 90deg, #2c3e50 90deg 100deg,
                #c0392b 100deg 110deg, #2c3e50 110deg 120deg,
                #c0392b 120deg 130deg, #2c3e50 130deg 140deg,
                #c0392b 140deg 150deg, #2c3e50 150deg 160deg,
                #c0392b 160deg 170deg, #2c3e50 170deg 180deg,
                #c0392b 180deg 190deg, #2c3e50 190deg 200deg,
                #c0392b 200deg 210deg, #2c3e50 210deg 220deg,
                #c0392b 220deg 230deg, #2c3e50 230deg 240deg,
                #c0392b 240deg 250deg, #2c3e50 250deg 260deg,
                #c0392b 260deg 270deg, #2c3e50 270deg 280deg,
                #c0392b 280deg 290deg, #2c3e50 290deg 300deg,
                #c0392b 300deg 310deg, #2c3e50 310deg 320deg,
                #c0392b 320deg 330deg, #2c3e50 330deg 340deg,
                #c0392b 340deg 350deg, #2c3e50 350deg 360deg
            );
            transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .result-number {
            position: absolute;
            font-size: 2em;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .betting-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .bet-btn {
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
        }
        .bet-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(192, 57, 43, 0.5);
        }
        .bet-btn.selected {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            transform: scale(1.1);
        }
        .result {
            font-size: 1.8em;
            margin: 20px 0;
            padding: 20px;
            background: rgba(192, 57, 43, 0.2);
            border: 2px solid rgba(192, 57, 43, 0.5);
            border-radius: 12px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .spin-btn {
            padding: 15px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            box-shadow: 0 4px 15px rgba(192, 57, 43, 0.3);
        }
        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(192, 57, 43, 0.5);
        }
        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="roulette-container">
        <h1>🎰 Roulette</h1>
        
        <div class="game-info">
            <div class="info-item">Balance: $<span id="balance">2500</span></div>
            <div class="info-item">Bet: $100</div>
        </div>

        <div class="wheel-container">
            <div class="wheel" id="wheel"></div>
            <div class="result-number" id="result-number"></div>
        </div>

        <div class="betting-options">
            <button class="bet-btn" data-bet="red">Red (2x)</button>
            <button class="bet-btn" data-bet="black">Black (2x)</button>
            <button class="bet-btn" data-bet="even">Even (2x)</button>
            <button class="bet-btn" data-bet="odd">Odd (2x)</button>
        </div>

        <div class="result" id="result"></div>

        <div class="controls">
            <button class="spin-btn" id="spin-btn">SPIN</button>
        </div>
    </div>

    <script>
// Get balance from URL parameter or use default
function getBalanceFromURL() {
    const params = new URLSearchParams(window.location.search);
    return parseInt(params.get('balance')) || window.playerMoney || 2500;
}

// Check if loaded standalone (not in iframe)
const isStandalone = window === window.top;
if (isStandalone) {
  window.playerMoney = 2500;
  window.updateMainGameBalance = function(balance) {
    // No-op in standalone mode
  };
} else {
  window.playerMoney = getBalanceFromURL();
}
</script>
<script src="script.js"></script>
<script>
// Auto-initialize
document.addEventListener('DOMContentLoaded', function() {
    const container = document.querySelector('.roulette-container');
    if (container && window.initRouletteMinigame) {
        window.initRouletteMinigame(container, window.playerMoney, window.updateMainGameBalance);
    }
});
</script>
</body>
</html>
