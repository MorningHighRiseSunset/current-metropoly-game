<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }
        
        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 30% 70%, rgba(155, 89, 182, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(142, 68, 173, 0.15) 0%, transparent 50%);
            animation: pulseBackground 8s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes pulseBackground {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .roulette-container {
            width: 100%;
            max-width: 350px;
            padding: 10px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #9b59b6, #8e44ad, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(155, 89, 182, 0.5);
            animation: titleGlow 2s ease-in-out infinite;
            letter-spacing: 2px;
        }
        
        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.15), rgba(142, 68, 173, 0.15));
            border: 2px solid rgba(155, 89, 182, 0.4);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(155, 89, 182, 0.3);
        }
        
        .info-item {
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }
        
        .wheel-container {
            margin-bottom: 25px;
            padding: 20px;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 50%;
            border: 8px solid;
            border-image: linear-gradient(45deg, #9b59b6, #8e44ad, #9b59b6) 1;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            box-shadow: 
                0 0 60px rgba(155, 89, 182, 0.4),
                inset 0 0 30px rgba(0, 0, 0, 0.6);
        }
        
        .wheel-container::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #9b59b6;
            z-index: 10;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }
        
        .wheel {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: conic-gradient(
                #9b59b6 0deg 10deg, #1a1a2e 10deg 20deg,
                #9b59b6 20deg 30deg, #1a1a2e 30deg 40deg,
                #9b59b6 40deg 50deg, #1a1a2e 50deg 60deg,
                #9b59b6 60deg 70deg, #1a1a2e 70deg 80deg,
                #9b59b6 80deg 90deg, #1a1a2e 90deg 100deg,
                #9b59b6 100deg 110deg, #1a1a2e 110deg 120deg,
                #9b59b6 120deg 130deg, #1a1a2e 130deg 140deg,
                #9b59b6 140deg 150deg, #1a1a2e 150deg 160deg,
                #9b59b6 160deg 170deg, #1a1a2e 170deg 180deg,
                #9b59b6 180deg 190deg, #1a1a2e 190deg 200deg,
                #9b59b6 200deg 210deg, #1a1a2e 210deg 220deg,
                #9b59b6 220deg 230deg, #1a1a2e 230deg 240deg,
                #9b59b6 240deg 250deg, #1a1a2e 250deg 260deg,
                #9b59b6 260deg 270deg, #1a1a2e 270deg 280deg,
                #9b59b6 280deg 290deg, #1a1a2e 290deg 300deg,
                #9b59b6 300deg 310deg, #1a1a2e 310deg 320deg,
                #9b59b6 320deg 330deg, #1a1a2e 330deg 340deg,
                #9b59b6 340deg 350deg, #1a1a2e 350deg 360deg
            );
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        
        .wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, #9b59b6, #8e44ad);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(155, 89, 182, 0.5);
        }
        
        .result-number {
            position: absolute;
            font-size: 2em;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 15px rgba(0,0,0,0.8), 0 0 30px rgba(155, 89, 182, 0.5);
            z-index: 5;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .betting-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .bet-btn {
            padding: 12px 25px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .bet-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .bet-btn:hover::before {
            left: 100%;
        }
        
        .bet-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.5);
        }
        
        .bet-btn.selected {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.5);
        }
        
        .result {
            font-size: 1.5em;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.2), rgba(142, 68, 173, 0.2));
            border: 2px solid rgba(155, 89, 182, 0.5);
            border-radius: 15px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(155, 89, 182, 0.2);
            transition: all 0.3s ease;
        }
        
        .result.win {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.3), rgba(39, 174, 96, 0.3));
            border-color: #2ecc71;
            animation: resultWin 0.5s ease-out;
        }
        
        @keyframes resultWin {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .spin-btn {
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }
        
        .spin-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s ease;
        }
        
        .spin-btn:hover::before {
            left: 100%;
        }
        
        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(155, 89, 182, 0.6);
        }
        
        .spin-btn:active:not(:disabled) {
            transform: translateY(-1px) scale(1.02);
        }
        
        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="roulette-container">
        <h1>🎰 ROULETTE</h1>
        
        <div class="game-info">
            <div class="info-item">💰 Balance: $<span id="balance">2500</span></div>
            <div class="info-item">🎯 Bet: $100</div>
        </div>

        <div class="wheel-container">
            <div class="wheel" id="wheel"></div>
            <div class="result-number" id="result-number"></div>
        </div>

        <div class="betting-options">
            <button class="bet-btn" data-bet="red">🔴 Red (2x)</button>
            <button class="bet-btn" data-bet="black">⚫ Black (2x)</button>
            <button class="bet-btn" data-bet="even">⚖️ Even (2x)</button>
            <button class="bet-btn" data-bet="odd">🎲 Odd (2x)</button>
        </div>

        <div class="result" id="result"></div>

        <div class="controls">
            <button class="spin-btn" id="spin-btn">🎲 SPIN</button>
        </div>
    </div>

    <script>
// Get balance from URL parameter or use default
function getBalanceFromURL() {
    const params = new URLSearchParams(window.location.search);
    return parseInt(params.get('balance')) || window.playerMoney || 2500;
}

// Check if loaded standalone (not in iframe)
const isStandalone = window === window.top;
if (isStandalone) {
  window.playerMoney = 2500;
  window.updateMainGameBalance = function(balance) {
    // No-op in standalone mode
  };
} else {
  window.playerMoney = getBalanceFromURL();
}
</script>
<script src="script.js"></script>
<script>
// Auto-initialize
document.addEventListener('DOMContentLoaded', function() {
    const container = document.querySelector('.roulette-container');
    if (container && window.initRouletteMinigame) {
        window.initRouletteMinigame(container, window.playerMoney, window.updateMainGameBalance);
    }
});
</script>
</body>
</html>
