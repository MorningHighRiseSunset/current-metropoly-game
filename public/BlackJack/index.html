<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack - Vegas Metropoly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .blackjack-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #9b59b6, #8e44ad, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(155, 89, 182, 0.3);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(155, 89, 182, 0.1);
            border: 1px solid rgba(155, 89, 182, 0.3);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .info-item {
            font-size: 1.2em;
            font-weight: bold;
        }

        .hands-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 30px;
        }

        .hand-section {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(155, 89, 182, 0.3);
            border-radius: 16px;
            padding: 20px;
            min-height: 150px;
        }

        .hand-label {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #9b59b6;
            font-weight: bold;
        }

        .hand {
            display: flex;
            justify-content: center;
            gap: 10px;
            min-height: 130px;
        }

        .score {
            font-size: 1.5em;
            margin-top: 15px;
            color: #f39c12;
            font-weight: bold;
        }

        .result {
            font-size: 2em;
            margin: 20px 0;
            padding: 20px;
            background: rgba(155, 89, 182, 0.2);
            border: 2px solid rgba(155, 89, 182, 0.5);
            border-radius: 12px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-hit {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
        }

        .btn-stand {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        @keyframes dealCard {
            from {
                opacity: 0;
                transform: translateY(-50px) rotate(-10deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotate(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .face-down {
            background: linear-gradient(145deg, #8e44ad, #9b59b6) !important;
            border-color: #9b59b6 !important;
        }
    </style>
</head>
<body>
    <div class="blackjack-container">
        <h1>🃏 Blackjack</h1>
        
        <div class="game-info">
            <div class="info-item">Balance: <span id="balance">$2500</span></div>
            <div class="info-item">Current Bet: <span id="current-bet">$0</span></div>
        </div>

        <div class="hands-container">
            <div class="hand-section">
                <div class="hand-label">Dealer's Hand</div>
                <div class="hand" id="dealer-hand"></div>
                <div class="score">Score: <span id="dealer-score">0</span></div>
            </div>

            <div class="hand-section">
                <div class="hand-label">Your Hand</div>
                <div class="hand" id="player-hand"></div>
                <div class="score">Score: <span id="player-score">0</span></div>
            </div>
        </div>

        <div class="result" id="result"></div>

        <div class="controls">
            <button class="btn" id="deal-btn">Deal ($100)</button>
            <button class="btn btn-hit" id="hit-btn" disabled>Hit</button>
            <button class="btn btn-stand" id="stand-btn" disabled>Stand</button>
        </div>
    </div>

    <script src="/runtime-config.js"></script>
    <script src="script.js"></script>
    <script>
        // Get balance from URL parameter or use default
        function getBalanceFromURL() {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get('balance')) || window.playerMoney || 2500;
        }
        
        // Auto-initialize for both standalone and iframe usage
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.blackjack-container');
            if (container && window.initBlackjackMinigame) {
                const balance = getBalanceFromURL();
                window.initBlackjackMinigame(container, balance, window.updateMainGameBalance);
            }
        });
    </script>
</body>
</html>
