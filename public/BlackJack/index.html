<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack - Vegas Metropoly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }
        
        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(155, 89, 182, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(142, 68, 173, 0.15) 0%, transparent 50%);
            animation: pulseBackground 8s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes pulseBackground {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .blackjack-container {
            width: 100%;
            max-width: 800px;
            padding: 30px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 25px;
            background: linear-gradient(45deg, #9b59b6, #8e44ad, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(155, 89, 182, 0.5);
            animation: titleGlow 2s ease-in-out infinite;
            letter-spacing: 2px;
        }
        
        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.15), rgba(142, 68, 173, 0.15));
            border: 2px solid rgba(155, 89, 182, 0.4);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(155, 89, 182, 0.3);
        }

        .info-item {
            font-size: 1.4em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }

        .hands-container {
            display: flex;
            flex-direction: column;
            gap: 35px;
            margin-bottom: 35px;
        }

        .hand-section {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(155, 89, 182, 0.4);
            border-radius: 20px;
            padding: 25px;
            min-height: 170px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(155, 89, 182, 0.2);
            transition: all 0.3s ease;
        }
        
        .hand-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(155, 89, 182, 0.3);
        }

        .hand-label {
            font-size: 1.4em;
            margin-bottom: 20px;
            color: #9b59b6;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }

        .hand {
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 140px;
        }

        .score {
            font-size: 1.6em;
            margin-top: 20px;
            color: #f39c12;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }

        .result {
            font-size: 2em;
            margin: 25px 0;
            padding: 25px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.25), rgba(142, 68, 173, 0.25));
            border: 2px solid rgba(155, 89, 182, 0.5);
            border-radius: 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(155, 89, 182, 0.3);
            transition: all 0.3s ease;
        }
        
        .result.win {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.3), rgba(39, 174, 96, 0.3));
            border-color: #2ecc71;
            animation: resultWin 0.5s ease-out;
        }
        
        .result.lose {
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.3), rgba(192, 57, 43, 0.3));
            border-color: #e74c3c;
        }
        
        @keyframes resultWin {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            padding: 18px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .btn:hover::before {
            left: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(155, 89, 182, 0.6);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-hit {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            box-shadow: 0 8px 20px rgba(39, 174, 96, 0.4);
        }

        .btn-stand {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4);
        }

        @keyframes dealCard {
            from {
                opacity: 0;
                transform: translateY(-60px) rotate(-15deg) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotate(0) scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .face-down {
            background: linear-gradient(145deg, #8e44ad, #9b59b6) !important;
            border-color: #9b59b6 !important;
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
        }
    </style>
</head>
<body>
    <div class="blackjack-container">
        <h1>🃏 BLACKJACK</h1>
        
        <div class="game-info">
            <div class="info-item">💰 Balance: $<span id="balance">2500</span></div>
            <div class="info-item">🎯 Current Bet: $<span id="current-bet">0</span></div>
        </div>

        <div class="hands-container">
            <div class="hand-section">
                <div class="hand-label">🤖 Dealer's Hand</div>
                <div class="hand" id="dealer-hand"></div>
                <div class="score">Score: <span id="dealer-score">0</span></div>
            </div>

            <div class="hand-section">
                <div class="hand-label">👤 Your Hand</div>
                <div class="hand" id="player-hand"></div>
                <div class="score">Score: <span id="player-score">0</span></div>
            </div>
        </div>

        <div class="result" id="result"></div>

        <div class="controls">
            <button class="btn" id="deal-btn">🎴 Deal ($100)</button>
            <button class="btn btn-hit" id="hit-btn" disabled>➕ Hit</button>
            <button class="btn btn-stand" id="stand-btn" disabled>✋ Stand</button>
        </div>
    </div>

    <script src="/runtime-config.js"></script>
    <script src="script.js"></script>
    <script>
        // Get balance from URL parameter or use default
        function getBalanceFromURL() {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get('balance')) || window.playerMoney || 2500;
        }
        
        // Auto-initialize for both standalone and iframe usage
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.blackjack-container');
            if (container && window.initBlackjackMinigame) {
                const balance = getBalanceFromURL();
                window.initBlackjackMinigame(container, balance, window.updateMainGameBalance);
            }
        });
    </script>
</body>
</html>
