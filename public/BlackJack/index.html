<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack - Vegas Metropoly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #0d0015 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }
        
        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(155, 89, 182, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(142, 68, 173, 0.15) 0%, transparent 50%);
            animation: pulseBackground 8s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes pulseBackground {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .blackjack-container {
            width: 95%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 1.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #9b59b6, #8e44ad, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(155, 89, 182, 0.5);
            animation: titleGlow 2s ease-in-out infinite;
            letter-spacing: 2px;
        }
        
        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.15), rgba(142, 68, 173, 0.15));
            border: 2px solid rgba(155, 89, 182, 0.4);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(155, 89, 182, 0.3);
        }

        .info-item {
            font-size: 0.85em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }

        /* Professional Casino Blackjack Table - Semicircle */
        .blackjack-table {
            background: linear-gradient(180deg, #1a472a 0%, #0d2b1a 100%);
            border: 4px solid #8b5cf6;
            border-radius: 100px 100px 0 0;
            padding: 15px 12px 12px 12px;
            margin: 8px 0;
            box-shadow: 0 25px 80px rgba(0,0,0,0.7), inset 0 0 120px rgba(0,0,0,0.5), 0 0 40px rgba(139, 92, 246, 0.3);
            position: relative;
            min-height: 150px;
            max-width: 100%;
            transform: scale(0.7);
            transform-origin: top center;
        }
        
        .blackjack-table::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(45deg, transparent, transparent 25px, rgba(255,255,255,0.03) 25px, rgba(255,255,255,0.03) 50px);
            pointer-events: none;
            border-radius: 285px 285px 0 0;
        }
        
        .blackjack-table::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-radius: 290px 290px 0 0;
            pointer-events: none;
        }

        .table-layout {
            display: flex;
            flex-direction: column;
            gap: 40px;
            position: relative;
            z-index: 2;
        }

        /* Dealer area */
        .dealer-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .dealer-label {
            font-size: 1.2em;
            color: #a78bfa;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .dealer-hand {
            display: flex;
            justify-content: center;
            gap: 10px;
            min-height: 100px;
        }

        .dealer-score {
            font-size: 1.3em;
            color: #a78bfa;
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }

        /* Player area */
        .player-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            max-width: 500px;
            margin: 0 auto;
        }

        .player-label {
            font-size: 1.3em;
            color: #a78bfa;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .player-hand {
            display: flex;
            justify-content: center;
            gap: 12px;
            min-height: 110px;
        }

        .player-score {
            font-size: 1.4em;
            color: #a78bfa;
            font-weight: bold;
            margin-top: 15px;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }

        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn {
            padding: 8px 15px;
            font-size: 0.8em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .btn:hover::before {
            left: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(155, 89, 182, 0.6);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-hit {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-stand {
            background: linear-gradient(135deg, #6d28d9, #5b21b6);
            box-shadow: 0 8px 20px rgba(109, 40, 217, 0.4);
        }

        @keyframes dealCard {
            from {
                opacity: 0;
                transform: translateY(-60px) rotate(-15deg) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotate(0) scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .face-down {
            background: linear-gradient(145deg, #8e44ad, #9b59b6) !important;
            border-color: #9b59b6 !important;
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
        }
    </style>
</head>
<body>
    <div class="blackjack-container">
        <h1>🃏 BLACKJACK</h1>
        
        <div class="game-info">
            <div class="info-item">💰 Balance: $<span id="balance">2500</span></div>
            <div class="info-item">Bet Amount: 
                <select id="bet-amount-selector" style="padding: 4px; border-radius: 4px; border: 1px solid #8b5cf6; background: rgba(0,0,0,0.3); color: white;">
                    <option value="10">$10</option>
                    <option value="25">$25</option>
                    <option value="50">$50</option>
                    <option value="100" selected>$100</option>
                    <option value="250">$250</option>
                    <option value="500">$500</option>
                    <option value="1000">$1000</option>
                </select>
            </div>
        </div>

        <div class="blackjack-table">
            <div class="table-markings"></div>
            
            <div class="table-layout">
                <div class="dealer-area">
                    <div class="dealer-label">Dealer</div>
                    <div class="dealer-hand" id="dealer-hand"></div>
                    <div class="dealer-score">Score: <span id="dealer-score">0</span></div>
                </div>

                <div class="player-area">
                    <div class="player-label">Player</div>
                    <div class="player-hand" id="player-hand"></div>
                    <div class="player-score">Score: <span id="player-score">0</span></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="deal-btn">🎴 Deal ($<span id="current-bet-display">100</span>)</button>
            <button class="btn btn-hit" id="hit-btn" disabled>➕ Hit</button>
            <button class="btn btn-stand" id="stand-btn" disabled>✋ Stand</button>
        </div>
    </div>

    <script src="/runtime-config.js"></script>
    <script src="script.js"></script>
    <script>
        // Get balance from URL parameter or use default
        function getBalanceFromURL() {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get('balance')) || window.playerMoney || 2500;
        }
        
        // Auto-initialize for both standalone and iframe usage
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.blackjack-container');
            if (container && window.initBlackjackMinigame) {
                const balance = getBalanceFromURL();
                window.initBlackjackMinigame(container, balance, window.updateMainGameBalance);
            }
        });
    </script>
</body>
</html>
