<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #07060c;
    overflow: hidden;
  }
  #poker-frame {
    width: 100vw;
    height: 100vh;
    border: none;
  }
</style>
</head>
<body>
<iframe id="poker-frame" src="poker.html"></iframe>
<script>
  // Get balance from parent window or use default
  const iframe = document.getElementById('poker-frame');
  
  // When poker.html loads, pass the balance
  iframe.onload = function() {
    try {
      const balance = window.parent.playerMoney || 2500;
      iframe.contentWindow.postMessage({ type: 'SET_BALANCE', balance }, '*');
    } catch (e) {
      console.log('Could not communicate with parent window');
    }
  };
  
  // Listen for balance updates from poker game
  window.addEventListener('message', function(event) {
    if (event.data.type === 'BALANCE_UPDATE') {
      try {
        // Update local balance
        window.__casinoBalance = event.data.balance;
        window.playerBalance = event.data.balance;
        
        // Notify parent window of balance change
        if (window.parent && window.parent.__casinoBalanceCallback) {
          window.parent.__casinoBalanceCallback(event.data.balance);
        }
      } catch (e) {
        console.log('Could not communicate with parent window');
      }
    }
  });
  
  // Expose balance for parent window to read
  window.__casinoBalance = window.parent.playerMoney || 2500;
  window.playerBalance = window.__casinoBalance;
</script>
</body>
</html>
