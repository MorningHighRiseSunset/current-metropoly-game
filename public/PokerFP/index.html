<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Poker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }
        
        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(155, 89, 182, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(142, 68, 173, 0.15) 0%, transparent 50%);
            animation: pulseBackground 8s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes pulseBackground {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .poker-container {
            width: 100%;
            max-width: 600px;
            padding: 15px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 2em;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #9b59b6, #8e44ad, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(155, 89, 182, 0.5);
            animation: titleGlow 2s ease-in-out infinite;
            letter-spacing: 2px;
        }
        
        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px 15px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.15), rgba(142, 68, 173, 0.15));
            border: 2px solid rgba(155, 89, 182, 0.4);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(155, 89, 182, 0.3);
        }
        
        .info-item {
            font-size: 1.1em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }
        
        .payout-info {
            margin-bottom: 15px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
        }
        
        .payout-text {
            font-size: 0.85em;
            color: #a78bfa;
            font-weight: normal;
            text-shadow: 0 0 5px rgba(155, 89, 182, 0.3);
        }
        
        /* Professional Casino Poker Table */
        .poker-table {
            background: linear-gradient(180deg, #1a472a 0%, #0d2b1a 100%);
            border: 12px solid #8b5cf6;
            border-radius: 20px;
            padding: 30px 25px;
            margin: 20px 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 100px rgba(0,0,0,0.4), 0 0 40px rgba(139, 92, 246, 0.3);
            position: relative;
            min-height: 400px;
        }
        
        .poker-table::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.02) 20px, rgba(255,255,255,0.02) 40px);
            pointer-events: none;
            border-radius: 12px;
        }
        
        .poker-table::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            pointer-events: none;
        }
        
        .table-layout {
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
            z-index: 1;
        }
        
        .hand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        
        .hand-label {
            font-size: 1.3em;
            margin-bottom: 10px;
            color: #a78bfa;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .hand-result {
            font-size: 1.1em;
            margin-top: 8px;
            color: #a78bfa;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }
        
        .status-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .status-message {
            font-size: 1.2em;
            color: #f0f0f0;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 15px rgba(155, 89, 182, 0.8);
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 25px;
            border-radius: 10px;
            border: 2px solid rgba(139, 92, 246, 0.4);
        }
        
        .hand {
            display: flex;
            justify-content: center;
            gap: 5px;
            min-height: 80px;
        }
        
        .card {
            width: 50px;
            height: 75px;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 2px solid #8b5cf6;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #a78bfa;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        
        .card.red {
            border-color: #e74c3c;
            color: #e74c3c;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        

        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 35px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(155, 89, 182, 0.6);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="poker-container">
        <h1>Poker</h1>
        
        <div class="game-info">
            <div class="info-item">Balance: $<span id="balance">2500</span></div>
            <div class="info-item">Bet: $100</div>
        </div>
        
        <div class="payout-info">
            <div class="payout-text">Straight Flush: 100x | Four of a Kind: 30x | Full House: 20x | Flush: 15x | Straight: 12x | Three of a Kind: 8x | Two Pair: 5x | Pair: 3x | High Card: 2x</div>
        </div>

        <div class="poker-table">
            <div class="table-layout">
                <div class="hand-section">
                    <div class="hand-label">AI's Hand</div>
                    <div class="hand" id="ai-hand"></div>
                    <div class="hand-result" id="ai-hand-result"></div>
                </div>

                <div class="status-section">
                    <div class="status-message" id="status-message">Click Deal to play</div>
                </div>

                <div class="hand-section">
                    <div class="hand-label">Your Hand</div>
                    <div class="hand" id="player-hand"></div>
                    <div class="hand-result" id="player-hand-result"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="deal-btn">Deal ($100)</button>
        </div>
    </div>

    <script>
// Get balance from URL parameter or use default
function getBalanceFromURL() {
    const params = new URLSearchParams(window.location.search);
    return parseInt(params.get('balance')) || window.playerMoney || 2500;
}

// Check if loaded standalone (not in iframe)
const isStandalone = window === window.top;
if (isStandalone) {
  window.playerMoney = 2500;
  window.updateMainGameBalance = function(balance) {
    // No-op in standalone mode
  };
} else {
  window.playerMoney = getBalanceFromURL();
}
</script>
<script src="script.js"></script>
<script>
// Auto-initialize
document.addEventListener('DOMContentLoaded', function() {
    const container = document.querySelector('.poker-container');
    if (container && window.initPokerMinigame) {
        window.initPokerMinigame(container, window.playerMoney, window.updateMainGameBalance);
    }
});
</script>
</body>
</html>
