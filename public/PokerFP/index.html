<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em Poker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(155, 89, 182, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(142, 68, 173, 0.15) 0%, transparent 50%);
            animation: pulseBackground 8s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes pulseBackground {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .poker-container {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 1.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #9b59b6, #8e44ad, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(155, 89, 182, 0.5);
            animation: titleGlow 2s ease-in-out infinite;
            letter-spacing: 2px;
        }
        
        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.15), rgba(142, 68, 173, 0.15));
            border: 2px solid rgba(155, 89, 182, 0.4);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(155, 89, 182, 0.3);
        }
        
        .info-item {
            font-size: 0.9em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }
        
        .poker-table {
            background: linear-gradient(180deg, #1a472a 0%, #0d2b1a 100%);
            border: 4px solid #8b5cf6;
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 100px rgba(0,0,0,0.4), 0 0 40px rgba(139, 92, 246, 0.3);
            position: relative;
            min-height: 280px;
        }
        
        .poker-table::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.02) 20px, rgba(255,255,255,0.02) 40px);
            pointer-events: none;
            border-radius: 12px;
        }
        
        .poker-table::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            pointer-events: none;
        }
        
        .table-layout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        
        .hand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px;
        }
        
        .hand-label {
            font-size: 0.8em;
            margin-bottom: 5px;
            color: #a78bfa;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .hand-result {
            font-size: 0.7em;
            margin-top: 3px;
            color: #a78bfa;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }
        
        .community-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        
        .community-label {
            font-size: 0.75em;
            margin-bottom: 5px;
            color: #a78bfa;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .pot-display {
            font-size: 0.9em;
            color: #f0f0f0;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
        }
        
        .status-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
        }
        
        .status-message {
            font-size: 0.8em;
            color: #f0f0f0;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 15px rgba(155, 89, 182, 0.8);
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 6px;
            border: 2px solid rgba(139, 92, 246, 0.4);
        }
        
        .hand {
            display: flex;
            justify-content: center;
            gap: 4px;
            min-height: 50px;
        }
        
        .card {
            width: 35px;
            height: 50px;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 2px solid #8b5cf6;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #a78bfa;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            animation: cardDeal 0.4s ease-out;
        }
        
        @keyframes cardDeal {
            0% { transform: translateY(-30px) scale(0.8); opacity: 0; }
            60% { transform: translateY(5px) scale(1.05); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        .card.red {
            color: #ef4444;
            border-color: #ef4444;
        }
        
        .card.face-down {
            background: linear-gradient(145deg, #8e44ad, #9b59b6);
            border-color: #9b59b6;
            color: #9b59b6;
        }
        
        .card.face-down::after {
            content: '🂠';
            font-size: 24px;
        }
        
        .community-cards {
            display: flex;
            justify-content: center;
            gap: 4px;
            min-height: 50px;
        }
        
        .community-cards .card {
            width: 35px;
            height: 50px;
        }
        
        .card-slot {
            width: 35px;
            height: 50px;
            border: 2px dashed rgba(139, 92, 246, 0.3);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.1);
        }
        
        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 8px 18px;
            font-size: 0.8em;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(155, 89, 182, 0.6);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-fold {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }
        
        .btn-check {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
        }
        
        .btn-raise {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body>
    <div class="poker-container">
        <h1>Texas Hold'em</h1>
        
        <div class="game-info">
            <div class="info-item">Balance: $<span id="balance">2500</span></div>
            <div class="info-item">Bet: $<span id="current-bet">100</span></div>
        </div>

        <div class="poker-table">
            <div class="table-layout">
                <div class="hand-section">
                    <div class="hand-label">AI's Hand</div>
                    <div class="hand" id="ai-hand"></div>
                    <div class="hand-result" id="ai-hand-result"></div>
                </div>

                <div class="community-section">
                    <div class="pot-display">Pot: $<span id="pot">0</span></div>
                    <div class="community-label">Community Cards</div>
                    <div class="community-cards" id="community-cards">
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                    </div>
                </div>

                <div class="status-section">
                    <div class="status-message" id="status-message">Click Deal to start</div>
                </div>

                <div class="hand-section">
                    <div class="hand-label">Your Hand</div>
                    <div class="hand" id="player-hand"></div>
                    <div class="hand-result" id="player-hand-result"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="action-btn">Deal</button>
        </div>
    </div>

    <script>
function getBalanceFromURL() {
    const params = new URLSearchParams(window.location.search);
    return parseInt(params.get('balance')) || window.playerMoney || 2500;
}

const isStandalone = window === window.top;
if (isStandalone) {
  window.playerMoney = 2500;
  window.updateMainGameBalance = function(balance) {};
} else {
  window.playerMoney = getBalanceFromURL();
}
</script>
<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.querySelector('.poker-container');
    if (container && window.initPokerMinigame) {
        window.initPokerMinigame(container, window.playerMoney, window.updateMainGameBalance);
    }
});
</script>
</body>
</html>
