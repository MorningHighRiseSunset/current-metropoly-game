<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #07060c;
    overflow: hidden;
  }

  body.iframe-mode {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #poker-frame {
    width: 100%;
    height: 100%;
    border: none;
  }

  body.iframe-mode #poker-frame {
    width: 100%;
    height: 100%;
    transform: none;
    border: none;
    overflow: hidden;
  }
</style>
</head>
<body>
<iframe id="poker-frame" src="poker.html"></iframe>
<script>
  // Detect if running in iframe
  function isInIframe() {
    try {
      return window.self !== window.top;
    } catch (e) {
      return true;
    }
  }

  // Get observer mode from URL parameter
  function isObserverMode() {
    const params = new URLSearchParams(window.location.search);
    return params.get('observer') === 'true';
  }

  // Add iframe mode class if needed
  if (isInIframe()) {
    document.body.classList.add('iframe-mode');
  }

  // Set observer mode flag for AI auto-play
  window.__isObserverMode = isObserverMode();

  // Get balance from parent window or use default
  const iframe = document.getElementById('poker-frame');
  let balanceCallback = null;
  let startingBalance = 2500;

  // When poker.html loads, pass the balance
  iframe.onload = function() {
    try {
      const balance = startingBalance;
      iframe.contentWindow.postMessage({ type: 'SET_BALANCE', balance }, '*');
    } catch (e) {
      console.log('Could not communicate with parent window');
    }
  };

  // Listen for balance updates from poker game
  window.addEventListener('message', function(event) {
    if (event.data.type === 'BALANCE_UPDATE') {
      try {
        // Update local balance
        window.__casinoBalance = event.data.balance;
        window.playerBalance = event.data.balance;

        // Notify parent window of balance change
        if (balanceCallback) {
          balanceCallback(event.data.balance);
        }
      } catch (e) {
        console.log('Could not communicate with parent window');
      }
    }
  });

  // Expose balance for parent window to read
  window.__casinoBalance = startingBalance;
  window.playerBalance = startingBalance;

  // Expose init function for main game integration
  window.initPokerMinigame = function(container, initialBalance, callback) {
    console.log('[Poker] initPokerMinigame called with balance:', initialBalance);

    // Set balance callback for the parent
    if (callback) {
      balanceCallback = callback;
    }

    // Update starting balance
    startingBalance = initialBalance || 2500;
    window.__casinoBalance = startingBalance;
    window.playerBalance = startingBalance;

    // Send initial balance to iframe
    try {
      iframe.contentWindow.postMessage({ type: 'SET_BALANCE', balance: startingBalance }, '*');
    } catch (e) {
      console.log('Could not communicate with iframe');
    }
  };
</script>
</body>
</html>
