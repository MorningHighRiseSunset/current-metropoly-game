<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Poker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .poker-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #9b59b6;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(155, 89, 182, 0.1);
            border: 1px solid rgba(155, 89, 182, 0.3);
            border-radius: 12px;
        }
        .info-item {
            font-size: 1.2em;
            font-weight: bold;
        }
        .hands-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }
        .hand-section {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(155, 89, 182, 0.3);
            border-radius: 16px;
            padding: 20px;
            min-height: 150px;
        }
        .hand-label {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #9b59b6;
            font-weight: bold;
        }
        .hand {
            display: flex;
            justify-content: center;
            gap: 10px;
            min-height: 120px;
        }
        .card {
            width: 70px;
            height: 100px;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 2px solid #27ae60;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #27ae60;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .card.red {
            border-color: #e74c3c;
            color: #e74c3c;
        }
        .result {
            font-size: 1.8em;
            margin: 20px 0;
            padding: 20px;
            background: rgba(155, 89, 182, 0.2);
            border: 2px solid rgba(155, 89, 182, 0.5);
            border-radius: 12px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.5);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="poker-container">
        <h1>🃏 Simple Poker</h1>
        
        <div class="game-info">
            <div class="info-item">Balance: $<span id="balance">2500</span></div>
            <div class="info-item">Pot: $<span id="pot">0</span></div>
        </div>

        <div class="hands-container">
            <div class="hand-section">
                <div class="hand-label">AI's Hand</div>
                <div class="hand" id="ai-hand"></div>
            </div>

            <div class="hand-section">
                <div class="hand-label">Your Hand</div>
                <div class="hand" id="player-hand"></div>
            </div>
        </div>

        <div class="result" id="result"></div>

        <div class="controls">
            <button class="btn" id="deal-btn">Deal ($100)</button>
        </div>
    </div>

    <script>
// Get balance from URL parameter or use default
function getBalanceFromURL() {
    const params = new URLSearchParams(window.location.search);
    return parseInt(params.get('balance')) || window.playerMoney || 2500;
}

// Check if loaded standalone (not in iframe)
const isStandalone = window === window.top;
if (isStandalone) {
  window.playerMoney = 2500;
  window.updateMainGameBalance = function(balance) {
    // No-op in standalone mode
  };
} else {
  window.playerMoney = getBalanceFromURL();
}
</script>
<script src="script.js"></script>
<script>
// Auto-initialize
document.addEventListener('DOMContentLoaded', function() {
    const container = document.querySelector('.poker-container');
    if (container && window.initPokerMinigame) {
        window.initPokerMinigame(container, window.playerMoney, window.updateMainGameBalance);
    }
});
</script>
</body>
</html>
