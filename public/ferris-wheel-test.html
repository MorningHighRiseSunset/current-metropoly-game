<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferris Wheel Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            max-width: 300px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
        }
        .success {
            color: #4CAF50;
            font-weight: bold;
        }
        .error {
            color: #f44336;
            font-weight: bold;
        }
        #scale-control {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
        }
        input[type="range"] {
            width: 200px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>Ferris Wheel Test</h3>
        <p>Use mouse to rotate/zoom</p>
        <p id="status">Loading...</p>
        <p id="model-info"></p>
    </div>
    <div id="loading">Loading Ferris Wheel...</div>
    
    <div id="scale-control">
        <label>Scale: <span id="scale-value">1.0</span></label><br>
        <input type="range" id="scale-slider" min="0.01" max="5.0" step="0.01" value="1.0">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, controls;
        let ferrisWheel;
        let currentScale = 1.0;

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            // Camera - positioned to see the model clearly
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 3);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0, 0);

            // Better lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
            backLight.position.set(-5, 5, -5);
            scene.add(backLight);

            // Add a ground plane for reference
            const groundGeometry = new THREE.PlaneGeometry(10, 10);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);

            // Add grid helper
            const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
            scene.add(gridHelper);

            // Add axes helper
            const axesHelper = new THREE.AxesHelper(2);
            scene.add(axesHelper);

            // Scale slider control
            const scaleSlider = document.getElementById('scale-slider');
            const scaleValue = document.getElementById('scale-value');
            scaleSlider.addEventListener('input', (e) => {
                currentScale = parseFloat(e.target.value);
                scaleValue.textContent = currentScale.toFixed(2);
                if (ferrisWheel) {
                    ferrisWheel.scale.set(currentScale, currentScale, currentScale);
                }
            });

            // Load Ferris Wheel
            loadFerrisWheel();

            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);

            // Start animation loop
            animate();
        }

        function loadFerrisWheel() {
            const loader = new THREE.GLTFLoader();
            
            // Try CDN first
            const cdnPath = 'https://pub-7e0044f8048c45d0a1c328e210708508.r2.dev/Models/ferrisWheel/ferris_wheel.glb';
            const localPath = '/Models/ferrisWheel/ferris_wheel.glb';
            
            const loadModel = (path) => {
                console.log('Loading from:', path);
                document.getElementById('status').textContent = 'Loading from: ' + path;
                
                loader.load(path,
                    function(gltf) {
                        ferrisWheel = gltf.scene;
                        
                        // Start with visible scale
                        ferrisWheel.scale.set(currentScale, currentScale, currentScale);
                        ferrisWheel.position.y = 0;
                        
                        // Enable shadows and get model info
                        let meshCount = 0;
                        let vertexCount = 0;
                        
                        ferrisWheel.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                                meshCount++;
                                if (child.geometry) {
                                    vertexCount += child.geometry.attributes.position.count;
                                }
                            }
                        });
                        
                        scene.add(ferrisWheel);
                        
                        // Show model info
                        document.getElementById('model-info').innerHTML = 
                            `<span class="success">✓ Loaded successfully!</span><br>` +
                            `Meshes: ${meshCount}<br>` +
                            `Vertices: ${vertexCount}<br>` +
                            `Animations: ${gltf.animations.length}`;
                        
                        // Setup animation if available
                        if (gltf.animations && gltf.animations.length > 0) {
                            const mixer = new THREE.AnimationMixer(ferrisWheel);
                            ferrisWheel.mixer = mixer;
                            
                            const action = mixer.clipAction(gltf.animations[0]);
                            action.timeScale = 1.0;
                            action.play();
                            
                            document.getElementById('status').innerHTML += '<br><span class="success">Animation playing</span>';
                        }
                        
                        document.getElementById('loading').style.display = 'none';
                        console.log('Ferris wheel loaded successfully');
                        console.log('Model info:', { meshCount, vertexCount, animations: gltf.animations.length });
                    },
                    function(xhr) {
                        if (xhr.lengthComputable) {
                            const percentComplete = xhr.loaded / xhr.total * 100;
                            if (percentComplete % 25 < 1 || percentComplete >= 100) {
                                console.log(`Loading: ${percentComplete.toFixed(0)}%`);
                                document.getElementById('status').textContent = `Loading: ${percentComplete.toFixed(0)}%`;
                            }
                        }
                    },
                    function(error) {
                        console.error('Error loading ferris wheel from', path, ':', error);
                        document.getElementById('status').innerHTML = '<span class="error">Error loading from: ' + path + '</span>';
                        
                        // Try fallback
                        if (path !== localPath) {
                            console.log('Trying local path...');
                            setTimeout(() => loadModel(localPath), 500);
                        } else {
                            document.getElementById('loading').textContent = 'Failed to load ferris wheel';
                            document.getElementById('loading').classList.add('error');
                        }
                    }
                );
            };
            
            loadModel(cdnPath);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Update animation
            if (ferrisWheel && ferrisWheel.mixer) {
                ferrisWheel.mixer.update(0.016); // ~60fps
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Auto-open in new tab
        window.onload = function() {
            init();
            // Open in new tab after short delay
            setTimeout(() => {
                console.log('Test page loaded. Access at: http://localhost:3000/ferris-wheel-test.html');
            }, 1000);
        };
    </script>
</body>
</html>
