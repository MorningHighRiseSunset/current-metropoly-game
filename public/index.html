<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vegas Metropoly</title>
    <script src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        
        .main-title {
            background: linear-gradient(90deg, #9b59b6, #8e44ad, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(155, 89, 182, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from {
                filter: drop-shadow(0 0 5px rgba(155, 89, 182, 0.5));
            }
            to {
                filter: drop-shadow(0 0 20px rgba(155, 89, 182, 0.8));
            }
        }
        
        .create-game-card {
            background: linear-gradient(145deg, rgba(155, 89, 182, 0.1), rgba(15, 52, 96, 0.3));
            border: 1px solid rgba(155, 89, 182, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .create-game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(155, 89, 182, 0.3);
            border-color: rgba(155, 89, 182, 0.6);
        }
        
        .card-icon {
            font-size: 4rem;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .lobby-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .lobby-card:hover {
            transform: scale(1.02);
            border-color: rgba(155, 89, 182, 0.5);
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #9b59b6, #8e44ad);
            border: none;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: linear-gradient(90deg, #8e44ad, #9b59b6);
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(155, 89, 182, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Settings Button -->
        <button id="settingsBtn" class="settings-btn" title="Settings">⚙️</button>
        
        <!-- Settings Modal -->
        <div id="settingsModal" class="modal hidden">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2>Settings</h2>
                <div class="settings-section">
                    <h3>Theme</h3>
                    <button id="themeToggle" class="theme-toggle-btn">🌙 Dark Mode</button>
                </div>
            </div>
        </div>

        <main>
            <div class="lobby-header">
                <h1 class="main-title">🎰 Vegas Metropoly</h1>
            </div>

            <div class="lobby-container">
                <!-- Create Game Section -->
                <div class="create-game-card">
                    <div class="card-icon">🎲</div>
                    <h2>Create New Game</h2>
                    <p class="card-description">Start a new game lobby and invite friends to play</p>
                    <button id="createGameBtn" class="btn btn-primary btn-large">
                        <span class="btn-icon">➕</span>
                        Create Game
                    </button>
                </div>

                <!-- Available Lobbies Section -->
                <div class="lobbies-section">
                    <div class="lobbies-header">
                        <h2>🎮 Available Lobbies</h2>
                        <button id="refreshLobbiesBtn" class="btn btn-refresh">
                            <span class="refresh-icon">🔄</span>
                        </button>
                    </div>
                    <div id="lobbiesList" class="lobbies-list">
                        <div class="loading-lobbies">Loading lobbies...</div>
                    </div>
                </div>
            </div>

            <div id="gameCreatedSection" class="hidden">
                <div class="game-lobby-container">
                    <div class="players-card">
                        <div class="card-header">
                            <h3>Players</h3>
                        </div>
                        <div class="card-body">
                            <div id="playersList" class="players-list"></div>
                            <div class="ai-controls">
                                <button id="addAiBtn" class="btn btn-secondary">+ Add AI</button>
                                <button id="removeAiBtn" class="btn btn-secondary">- Remove AI</button>
                            </div>
                            <button id="startGameBtn" class="btn btn-success hidden">Start Game</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="lobbySection" class="hidden">
                <div class="game-lobby-container">
                    <div class="players-card">
                        <div class="card-header">
                            <h3>Players</h3>
                        </div>
                        <div class="card-body">
                            <div id="lobbyPlayersList" class="players-list"></div>
                            <div class="lobby-status">
                                <p id="lobbyStatus">Waiting for host to start the game...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div id="messageModal" class="modal hidden">
            <div class="modal-content">
                <span class="close">&times;</span>
                <p id="modalMessage"></p>
                <button id="modalOkBtn" class="btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script src="runtime-config.js?v=20250811-http-fix"></script>
    <script src="/analytics.js"></script>
    <script>
        // console.log('HTML loaded successfully!');
        // document.addEventListener('DOMContentLoaded', function() {
        //     console.log('DOM Content Loaded - All elements should be available');
        // });
    </script>
    <script src="lobby.js"></script>
</body>
</html>
