
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Craps Table</title>
	<link rel="icon" href="data:image/x-icon;," type="image/x-icon">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			min-height: 100vh;
		}
	</style>
</head>
<body>
	<div class="craps-table-container"></div>
	<script>
	// Get balance from URL parameter or use default
	function getBalanceFromURL() {
	    const params = new URLSearchParams(window.location.search);
	    return parseInt(params.get('balance')) || window.playerMoney || 2500;
	}
	
	// Check if loaded standalone (not in iframe)
	const isStandalone = window === window.top;
	if (isStandalone) {
		// Initialize with default values for standalone mode
		window.playerMoney = 2500;
		window.updateMainGameBalance = function(balance) {
			// No-op in standalone mode
		};
	} else {
		// Use balance from URL when in iframe
		window.playerMoney = getBalanceFromURL();
	}
	</script>
	<script src="script.js"></script>
	<script>
	// Auto-initialize
	document.addEventListener('DOMContentLoaded', function() {
		const container = document.querySelector('.craps-table-container');
		if (container && window.initCrapsMinigame) {
			window.initCrapsMinigame(container, window.playerMoney, window.updateMainGameBalance);
		}
	});
	</script>
</body>
</html>
