<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Craps</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(135deg, #1a0a2e 0%, #0d0015 100%);
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			color: white;
			overflow: hidden;
		}
		
		/* Animated background */
		body::before {
			content: '';
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: 
				radial-gradient(circle at 20% 80%, rgba(155, 89, 182, 0.15) 0%, transparent 50%),
				radial-gradient(circle at 80% 20%, rgba(142, 68, 173, 0.15) 0%, transparent 50%);
			animation: pulseBackground 8s ease-in-out infinite;
			pointer-events: none;
		}
		
		@keyframes pulseBackground {
			0%, 100% { opacity: 0.5; }
			50% { opacity: 1; }
		}
		
		.craps-container {
			width: 100%;
			max-width: 500px;
			padding: 20px;
			text-align: center;
			position: relative;
			z-index: 1;
		}
		
		h1 {
			font-size: 2.5em;
			margin-bottom: 20px;
			background: linear-gradient(45deg, #9b59b6, #8e44ad, #9b59b6);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			text-shadow: 0 0 30px rgba(155, 89, 182, 0.5);
			animation: titleGlow 2s ease-in-out infinite;
			letter-spacing: 2px;
		}
		
		@keyframes titleGlow {
			0%, 100% { filter: brightness(1); }
			50% { filter: brightness(1.3); }
		}
		
		.game-info {
			display: flex;
			justify-content: space-between;
			margin-bottom: 20px;
			padding: 15px;
			background: linear-gradient(135deg, rgba(155, 89, 182, 0.15), rgba(142, 68, 173, 0.15));
			border: 2px solid rgba(155, 89, 182, 0.4);
			border-radius: 15px;
			backdrop-filter: blur(10px);
			box-shadow: 0 8px 32px rgba(155, 89, 182, 0.3);
		}
		
		.info-item {
			font-size: 1.2em;
			font-weight: bold;
			text-shadow: 0 0 10px rgba(155, 89, 182, 0.5);
		}
		
		.dice-display {
			font-size: 4em;
			margin: 25px 0;
			min-height: 80px;
			display: flex;
		 align-items: center;
		 justify-content: center;
		 gap: 20px;
		}
		
		.dice {
			width: 80px;
			height: 80px;
			background: linear-gradient(145deg, #ffffff, #f0f0f0);
			border-radius: 15px;
			display: flex;
		 align-items: center;
		 justify-content: center;
		 font-size: 2.5em;
		 box-shadow: 0 8px 20px rgba(0,0,0,0.3);
		 color: #1a1a2e;
		 transition: transform 0.3s ease;
		}
		
		.dice.rolling {
			animation: diceRoll 0.5s ease-in-out infinite;
		}
		
		@keyframes diceRoll {
			0% { transform: rotate(0deg) scale(1); }
			25% { transform: rotate(90deg) scale(1.1); }
			50% { transform: rotate(180deg) scale(1); }
			75% { transform: rotate(270deg) scale(1.1); }
			100% { transform: rotate(360deg) scale(1); }
		}
		
		.result {
			font-size: 1.5em;
			margin: 20px 0;
			padding: 20px;
			background: linear-gradient(135deg, rgba(155, 89, 182, 0.2), rgba(142, 68, 173, 0.2));
			border: 2px solid rgba(155, 89, 182, 0.5);
			border-radius: 15px;
			min-height: 60px;
			display: flex;
		 align-items: center;
		 justify-content: center;
			backdrop-filter: blur(10px);
			box-shadow: 0 8px 32px rgba(155, 89, 182, 0.2);
			transition: all 0.3s ease;
		}
		
		.result.win {
			background: linear-gradient(135deg, rgba(46, 204, 113, 0.3), rgba(39, 174, 96, 0.3));
			border-color: #2ecc71;
			animation: resultWin 0.5s ease-out;
		}
		
		@keyframes resultWin {
			0% { transform: scale(0.8); opacity: 0; }
			50% { transform: scale(1.1); }
			100% { transform: scale(1); opacity: 1; }
		}
		
		.controls {
			display: flex;
			gap: 15px;
			justify-content: center;
			flex-wrap: wrap;
		}
		
		.btn {
			padding: 15px 30px;
			font-size: 1.1em;
			font-weight: bold;
			border: none;
			border-radius: 12px;
			cursor: pointer;
			transition: all 0.3s ease;
			background: linear-gradient(135deg, #9b59b6, #8e44ad);
			color: white;
			box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
			text-transform: uppercase;
			letter-spacing: 1px;
			position: relative;
			overflow: hidden;
		}
		
		.btn::before {
			content: '';
			position: absolute;
			top: 0;
			left: -100%;
			width: 100%;
			height: 100%;
			background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
			transition: left 0.5s ease;
		}
		
		.btn:hover::before {
			left: 100%;
		}
		
		.btn:hover:not(:disabled) {
			transform: translateY(-3px) scale(1.05);
			box-shadow: 0 12px 30px rgba(155, 89, 182, 0.6);
		}
		
		.btn:disabled {
			opacity: 0.5;
			cursor: not-allowed;
			transform: none;
		}
		
		.btn-pass {
			background: linear-gradient(135deg, #27ae60, #2ecc71);
			box-shadow: 0 8px 20px rgba(39, 174, 96, 0.4);
		}
		
		.btn-dont {
			background: linear-gradient(135deg, #e74c3c, #c0392b);
			box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4);
		}
	</style>
</head>
<body>
	<div class="craps-container">
		<h1>🎲 Craps</h1>
		
		<div class="game-info">
			<div class="info-item">💰 Balance: $<span id="craps-balance">2500</span></div>
			<div class="info-item">🎯 Current Bet: $<span id="craps-bet">0</span></div>
		</div>
		
		<div style="font-size: 1.2em; margin-bottom: 15px; color: #9b59b6;">Phase: <span id="craps-phase">Come Out</span> | Point: <span id="craps-point">-</span></div>
		
		<div class="dice-display">
			<div class="dice" id="dice1">🎲</div>
			<div class="dice" id="dice2">🎲</div>
		</div>
		
		<div class="result" id="craps-result"></div>
		
		<div class="controls">
			<button class="btn btn-pass" id="bet-pass">🎯 Pass Line ($100)</button>
			<button class="btn btn-dont" id="bet-dont">❌ Don't Pass ($100)</button>
			<button class="btn" id="roll-btn" disabled>🎲 Roll Dice</button>
		</div>
	</div>
	
	<script>
	// Get balance from URL parameter or use default
	function getBalanceFromURL() {
	    const params = new URLSearchParams(window.location.search);
	    return parseInt(params.get('balance')) || window.playerMoney || 2500;
	}
	
	// Check if loaded standalone (not in iframe)
	const isStandalone = window === window.top;
	if (isStandalone) {
		window.playerMoney = 2500;
		window.updateMainGameBalance = function(balance) {
			// No-op in standalone mode
		};
	} else {
		window.playerMoney = getBalanceFromURL();
	}
	</script>
	<script src="script.js"></script>
	<script>
	// Auto-initialize
	document.addEventListener('DOMContentLoaded', function() {
		const container = document.querySelector('.craps-container');
		if (container && window.initCrapsMinigame) {
			window.initCrapsMinigame(container, window.playerMoney, window.updateMainGameBalance);
		}
	});
	</script>
</body>
</html>
