<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="craps-game">
        <div class="game-header">
            <h1>🎲 CRAPS</h1>
            <div class="game-info">
                <div class="info-item">💰 Balance: $<span id="balance">2500</span></div>
                <div class="info-item">🎯 Bet: $<span id="current-bet">0</span></div>
                <div class="info-item">Bet Amount: 
                    <select id="bet-amount-selector" style="padding: 4px; border-radius: 4px; border: 1px solid #8b5cf6; background: rgba(0,0,0,0.3); color: white;">
                        <option value="10">$10</option>
                        <option value="25">$25</option>
                        <option value="50">$50</option>
                        <option value="100" selected>$100</option>
                        <option value="250">$250</option>
                        <option value="500">$500</option>
                        <option value="1000">$1000</option>
                    </select>
                </div>
            </div>
            <div class="phase-info">
                <span>Phase: <strong id="phase">Come Out</strong></span>
                <span>Point: <strong id="point">-</strong></span>
            </div>
        </div>

        <div class="craps-table">
            <!-- Top Section - Pass Line and Don't Pass -->
            <div class="table-section top-section">
                <div class="bet-area pass-line" data-bet="pass">
                    <span class="bet-label">PASS LINE</span>
                    <span class="payout">1:1</span>
                </div>
                <div class="bet-area dont-pass" data-bet="dont-pass">
                    <span class="bet-label">DON'T PASS</span>
                    <span class="payout">1:1</span>
                </div>
            </div>

            <!-- Middle Section - Come and Place Bets -->
            <div class="table-section middle-section">
                <div class="come-area">
                    <div class="bet-area come" data-bet="come">
                        <span class="bet-label">COME</span>
                        <span class="payout">1:1</span>
                    </div>
                </div>
                
                <div class="place-bets">
                    <div class="bet-area place-bet" data-bet="4">
                        <span class="bet-number">4</span>
                        <span class="payout">9:5</span>
                    </div>
                    <div class="bet-area place-bet" data-bet="5">
                        <span class="bet-number">5</span>
                        <span class="payout">7:5</span>
                    </div>
                    <div class="bet-area place-bet" data-bet="6">
                        <span class="bet-number">6</span>
                        <span class="payout">7:6</span>
                    </div>
                    <div class="bet-area place-bet" data-bet="8">
                        <span class="bet-number">8</span>
                        <span class="payout">7:6</span>
                    </div>
                    <div class="bet-area place-bet" data-bet="9">
                        <span class="bet-number">9</span>
                        <span class="payout">7:5</span>
                    </div>
                    <div class="bet-area place-bet" data-bet="10">
                        <span class="bet-number">10</span>
                        <span class="payout">9:5</span>
                    </div>
                </div>

                <div class="dont-come-area">
                    <div class="bet-area dont-come" data-bet="dont-come">
                        <span class="bet-label">DON'T COME</span>
                        <span class="payout">1:1</span>
                    </div>
                </div>
            </div>

            <!-- Center Section - Prop Bets -->
            <div class="table-section center-section">
                <div class="field-bet bet-area" data-bet="field">
                    <span class="bet-label">FIELD</span>
                    <span class="payout">2:1 on 2,12</span>
                </div>
                
                <div class="center-bets">
                    <div class="bet-area center-bet" data-bet="any-craps">
                        <span class="bet-label">ANY CRAPS</span>
                        <span class="payout">7:1</span>
                    </div>
                    <div class="bet-area center-bet" data-bet="7">
                        <span class="bet-label">7</span>
                        <span class="payout">4:1</span>
                    </div>
                    <div class="bet-area center-bet" data-bet="hard-4">
                        <span class="bet-label">HARD 4</span>
                        <span class="payout">7:1</span>
                    </div>
                    <div class="bet-area center-bet" data-bet="hard-6">
                        <span class="bet-label">HARD 6</span>
                        <span class="payout">9:1</span>
                    </div>
                    <div class="bet-area center-bet" data-bet="hard-8">
                        <span class="bet-label">HARD 8</span>
                        <span class="payout">9:1</span>
                    </div>
                    <div class="bet-area center-bet" data-bet="hard-10">
                        <span class="bet-label">HARD 10</span>
                        <span class="payout">7:1</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dice Display Area (outside table) -->
        <div class="dice-area">
            <div class="dice-container">
                <div class="dice" id="dice1">🎲</div>
                <div class="dice" id="dice2">🎲</div>
            </div>
            <div class="result" id="result">Place your bet!</div>
        </div>

        <div class="controls">
            <button class="btn" id="roll-btn" disabled>🎲 Roll</button>
            <button class="btn" id="clear-btn">🗑️ Clear Bets</button>
        </div>
    </div>

    <script>
    // Get balance from URL parameter or use default
    function getBalanceFromURL() {
        const params = new URLSearchParams(window.location.search);
        return parseInt(params.get('balance')) || window.playerMoney || 2500;
    }

    // Check if loaded standalone (not in iframe)
    const isStandalone = window === window.top;
    if (isStandalone) {
        window.playerMoney = 2500;
        window.updateMainGameBalance = function(balance) {
            // No-op in standalone mode
        };
    } else {
        window.playerMoney = getBalanceFromURL();
    }
    </script>
    <script src="script.js"></script>
    <script>
    // Auto-initialize
    document.addEventListener('DOMContentLoaded', function() {
        const container = document.querySelector('.craps-game');
        if (container && window.initCrapsMinigame) {
            window.initCrapsMinigame(container, window.playerMoney, window.updateMainGameBalance);
        }
    });
    </script>
</body>
</html>
