<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c2c2c;
        }
        .betting-area { cursor: pointer; transition: all 0.3s ease; }
        .betting-area:hover { filter: brightness(1.5); }
        #pass-line-area:hover { fill: rgba(255, 215, 0, 0.3); }
        #dont-pass-area:hover { fill: rgba(255, 107, 107, 0.3); }
        #come-area:hover { fill: rgba(255, 107, 107, 0.3); }
        #field-area:hover { fill: rgba(255, 255, 0, 0.3); }
    </style>
</head>
<body>
    <div id="svg-container"></div>
    <script>
        fetch('Craps-interactive.svg')
            .then(response => response.text())
            .then(svgContent => {
                document.getElementById('svg-container').innerHTML = svgContent;
            });
    </script>
</body>
</html>
