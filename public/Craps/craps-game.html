<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../dice-glb-config.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .top-bar {
            display: flex;
            gap: 30px;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .game-container {
            position: relative;
            width: 850px;
            height: 550px;
        }
        
        .game-container svg {
            width: 100%;
            height: 100%;
        }
        
        /* Chip styles - unified for both selector and table */
        .chip, .table-chip {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            box-shadow: 0 6px 12px rgba(0,0,0,0.5), inset 0 3px 6px rgba(255,255,255,0.4), inset 0 -3px 6px rgba(0,0,0,0.3);
            border: 4px solid rgba(255,255,255,0.3);
            position: relative;
        }
        
        .chip::before, .table-chip::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.6);
        }
        
        .chip::after, .table-chip::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
        }
        
        /* Chip selector specific */
        .chip {
            position: relative;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 12px;
            user-select: none;
            transition: transform 0.1s;
        }
        
        .chip:active {
            transform: scale(1.1);
        }
        
        .chip.selected {
            box-shadow: 0 0 0 4px #ffd700, 0 6px 12px rgba(255,215,0,0.5);
        }
        
        /* Table chip specific */
        .table-chip {
            position: absolute;
            width: 38px;
            height: 38px;
            font-size: 9px;
            z-index: 10;
            pointer-events: none;
        }
        
        /* Chip colors - standard casino colors */
        .chip-1, .table-chip.chip-1 { 
            background: linear-gradient(145deg, #ffffff, #e0e0e0) !important; 
            color: #333 !important;
            border-color: #aaa !important;
        }
        .chip-5, .table-chip.chip-5 { 
            background: linear-gradient(145deg, #e53935, #b71c1c) !important; 
            border-color: #ef9a9a !important;
        }
        .chip-10, .table-chip.chip-10 { 
            background: linear-gradient(145deg, #1e88e5, #0d47a1) !important; 
            border-color: #90caf9 !important;
        }
        .chip-25, .table-chip.chip-25 { 
            background: linear-gradient(145deg, #43a047, #1b5e20) !important; 
            border-color: #a5d6a7 !important;
        }
        .chip-100, .table-chip.chip-100 { 
            background: linear-gradient(145deg, #212121, #000000) !important; 
            border-color: #757575 !important;
        }
        .chip-500, .table-chip.chip-500 { 
            background: linear-gradient(145deg, #8e24aa, #4a148c) !important; 
            border-color: #ce93d8 !important;
        }
        .chip-1000, .table-chip.chip-1000 { 
            background: linear-gradient(145deg, #fb8c00, #e65100) !important; 
            border-color: #ffcc80 !important;
        }
        
        /* Chip selector */
        .chip-selector {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
        }
        
        .chip-selector .chip {
            position: relative;
            width: 50px;
            height: 50px;
            font-size: 14px;
        }
        
        .chip-selector .chip.selected {
            box-shadow: 0 0 0 3px #ffd700, 0 4px 12px rgba(255,215,0,0.5);
        }
        
        /* 3D Dice Container */
        #dice-canvas-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 300px;
            z-index: 50;
            display: none;
        }
        
        #dice-canvas-container.rolling {
            display: block;
        }
        

        
        /* Info panel */
        .info-panel {
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            min-width: 200px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .balance-display {
            font-size: 18px;
            color: #ffd700;
            font-weight: bold;
        }
        
        .bet-display {
            font-size: 14px;
        }
        
        .dice-result {
            font-size: 14px;
            color: #ffd700;
        }
        
        .controls {
            display: flex;
            gap: 8px;
        }
        
        button {
            padding: 12px 24px;
            background: #ffd700;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        
        button:hover {
            background: #ffed4a;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .clear-btn {
            background: #ff6b6b;
        }
        
        .clear-btn:hover {
            background: #ff8787;
        }
        
        /* Chip on table */
        .table-chip {
            position: absolute;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 9px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3);
            border: 3px solid rgba(255,255,255,0.3);
            z-index: 10;
            pointer-events: none;
        }
        
        .table-chip::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.5);
        }
        
        .table-chip::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    
    <div class="top-bar">
        <div class="chip-selector">
            <div class="chip chip-1 selected" data-value="1">$1</div>
            <div class="chip chip-5" data-value="5">$5</div>
            <div class="chip chip-10" data-value="10">$10</div>
            <div class="chip chip-25" data-value="25">$25</div>
            <div class="chip chip-100" data-value="100">$100</div>
            <div class="chip chip-500" data-value="500">$500</div>
            <div class="chip chip-1000" data-value="1000">$1000</div>
        </div>
        
        <div class="info-panel">
            <div class="balance-display">Balance: $<span id="balance">1000</span></div>
            <div class="bet-display">Total Bet: $<span id="totalBet">0</span></div>
            <div class="dice-result" id="diceResult"></div>
            <div class="controls">
                <button id="rollBtn">Roll Dice</button>
                <button id="clearBtn" class="clear-btn">Clear Bets</button>
            </div>
        </div>
    </div>
    
    <div class="game-container" id="gameContainer">
        <div id="svgContainer"></div>
        
        <div id="dice-canvas-container">
            <canvas id="diceCanvas"></canvas>
        </div>
    </div>

    <script>
        // Override dice configuration for craps-specific behavior
        const CRAPS_DICE_CONFIG = {
            ...DICE_GLB_CONFIG,
            rollDurationMs: 1200,  // Longer roll for more air time
            settleHoldMs: 1500,     // Longer pause after landing
            tossHeight: 3.5,        // Higher toss for more air rolling
            scale: 0.5              // Slightly larger dice for craps
        };

        function createDiceTexture(value) {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#f0f0f0');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 8;
            ctx.strokeRect(4, 4, size - 8, size - 8);

            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 3;
            ctx.strokeRect(12, 12, size - 24, size - 24);

            const pipRadius = size / 14;
            const pipPositions = {
                1: [[0.5, 0.5]],
                2: [[0.25, 0.25], [0.75, 0.75]],
                3: [[0.25, 0.25], [0.5, 0.5], [0.75, 0.75]],
                4: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]],
                5: [[0.25, 0.25], [0.75, 0.25], [0.5, 0.5], [0.25, 0.75], [0.75, 0.75]],
                6: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.5], [0.75, 0.5], [0.25, 0.75], [0.75, 0.75]]
            };

            const positions = pipPositions[value] || pipPositions[1];
            positions.forEach(([x, y]) => {
                const px = x * size;
                const py = y * size;
                
                ctx.beginPath();
                ctx.arc(px + 3, py + 3, pipRadius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fill();
                
                const pipGradient = ctx.createRadialGradient(px - pipRadius * 0.3, py - pipRadius * 0.3, 0, px, py, pipRadius);
                pipGradient.addColorStop(0, '#444444');
                pipGradient.addColorStop(1, '#000000');
                ctx.fillStyle = pipGradient;
                ctx.beginPath();
                ctx.arc(px, py, pipRadius, 0, Math.PI * 2);
                ctx.fill();
            });

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function createDiceMesh() {
            const size = CRAPS_DICE_CONFIG.scale;
            const geometry = new THREE.BoxGeometry(size, size, size, 4, 4, 4);
            
            const materials = [
                new THREE.MeshStandardMaterial({ map: createDiceTexture(2), roughness: 0.2, metalness: 0.15 }),
                new THREE.MeshStandardMaterial({ map: createDiceTexture(5), roughness: 0.2, metalness: 0.15 }),
                new THREE.MeshStandardMaterial({ map: createDiceTexture(1), roughness: 0.2, metalness: 0.15 }),
                new THREE.MeshStandardMaterial({ map: createDiceTexture(6), roughness: 0.2, metalness: 0.15 }),
                new THREE.MeshStandardMaterial({ map: createDiceTexture(4), roughness: 0.2, metalness: 0.15 }),
                new THREE.MeshStandardMaterial({ map: createDiceTexture(3), roughness: 0.2, metalness: 0.15 })
            ];

            const dice = new THREE.Mesh(geometry, materials);
            dice.castShadow = true;
            dice.receiveShadow = true;
            return dice;
        }

        // Three.js setup
        let scene, camera, renderer, dice1Mesh, dice2Mesh;
        let diceRolling = false;
        let diceRollAnimFrame = null;

        function initDice() {
            const container = document.getElementById('dice-canvas-container');
            const canvas = document.getElementById('diceCanvas');
            
            console.log('Initializing dice system...');
            console.log('Container dimensions:', container.clientWidth, container.clientHeight);
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 5, 8);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setClearColor(0x000000, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            dice1Mesh = createDiceMesh();
            dice2Mesh = createDiceMesh();
            dice1Mesh.visible = false;
            dice2Mesh.visible = false;
            scene.add(dice1Mesh);
            scene.add(dice2Mesh);
            
            console.log('Dice meshes created:', dice1Mesh, dice2Mesh);

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();
            console.log('Dice animation loop started');
        }

        // Using shared runDiceRollAnimation from dice-glb-config.js

        function roll3DDice(dice1Value, dice2Value, onComplete) {
            console.log('roll3DDice called with values:', dice1Value, dice2Value);
            
            if (diceRollAnimFrame) {
                cancelAnimationFrame(diceRollAnimFrame);
                diceRollAnimFrame = null;
            }

            // Resize renderer when container becomes visible
            const container = document.getElementById('dice-canvas-container');
            console.log('Container dimensions before resize:', container.clientWidth, container.clientHeight);
            
            if (container.clientWidth > 0 && container.clientHeight > 0) {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
                console.log('Renderer resized to:', container.clientWidth, container.clientHeight);
            }

            console.log('Making dice visible...');
            dice1Mesh.visible = true;
            dice2Mesh.visible = true;
            console.log('Dice visibility set to true');

            const anchor = { x: 0, y: 0, z: 0 };
            console.log('Starting roll animation with duration:', CRAPS_DICE_CONFIG.rollDurationMs);
            
            const rollTick = runDiceRollAnimation({
                meshes: [dice1Mesh, dice2Mesh],
                values: [dice1Value, dice2Value],
                duration: CRAPS_DICE_CONFIG.rollDurationMs,
                tossHeight: CRAPS_DICE_CONFIG.tossHeight,
                anchor,
                onComplete: () => {
                    console.log('Roll animation complete');
                    setTimeout(() => {
                        dice1Mesh.visible = false;
                        dice2Mesh.visible = false;
                        if (onComplete) onComplete();
                    }, CRAPS_DICE_CONFIG.settleHoldMs);
                }
            });

            function animateDiceFrame(now) {
                if (rollTick && rollTick(now)) {
                    diceRollAnimFrame = requestAnimationFrame(animateDiceFrame);
                } else {
                    diceRollAnimFrame = null;
                }
            }
            diceRollAnimFrame = requestAnimationFrame(animateDiceFrame);
            console.log('Animation frame requested');
        }

        let balance = 1000;
        let selectedChip = 1;
        let bets = {};
        let isRolling = false;
        
        const gameContainer = document.getElementById('gameContainer');
        const diceCanvasContainer = document.getElementById('dice-canvas-container');
        const balanceEl = document.getElementById('balance');
        const totalBetEl = document.getElementById('totalBet');
        const diceResultEl = document.getElementById('diceResult');
        const rollBtn = document.getElementById('rollBtn');
        const clearBtn = document.getElementById('clearBtn');
        const svgContainer = document.getElementById('svgContainer');
        
        // Load and inline the SVG
        fetch('Craps-interactive.svg')
            .then(response => response.text())
            .then(svgText => {
                svgContainer.innerHTML = svgText;
                
                // Map betting area IDs to the actual elements
                const bettingMap = {
                    'come-group': 'come',
                    'field-group': 'field',
                    'pass-line-group': 'pass-line'
                };
                
                // Now attach click handlers to betting areas
                document.querySelectorAll('.betting-area').forEach(area => {
                    area.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const betId = bettingMap[area.id] || area.id;
                        placeBet(betId, selectedChip);
                    });
                });
                
                // Re-render chips after SVG is loaded
                renderTableChips();
            });
        
        // Chip selection
        document.querySelectorAll('.chip-selector .chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.chip-selector .chip').forEach(c => c.classList.remove('selected'));
                chip.classList.add('selected');
                selectedChip = parseInt(chip.dataset.value);
            });
        });
        
        function placeBet(areaId, amount) {
            if (balance < amount) {
                alert('Insufficient balance');
                return;
            }
            
            if (!bets[areaId]) bets[areaId] = 0;
            bets[areaId] += amount;
            balance -= amount;
            
            // Store the last chip denomination used for this area
            bets[areaId + '_lastChip'] = amount;
            
            updateBalance();
            renderTableChips();
        }
        
        function renderTableChips() {
            // Remove existing table chips
            document.querySelectorAll('.table-chip').forEach(chip => chip.remove());
            
            // Map bet IDs back to SVG element IDs
            const idMap = {
                'come': 'come-group',
                'field': 'field-group',
                'pass-line': 'pass-line-group'
            };
            
            // Add chips for each bet
            Object.entries(bets).forEach(([areaId, amount]) => {
                if (amount > 0 && !areaId.includes('_lastChip')) {
                    const chip = document.createElement('div');
                    
                    // Use the last chip denomination used for this area
                    const lastChip = bets[areaId + '_lastChip'] || amount;
                    let chipClass = 'chip-100';
                    if (lastChip === 1) chipClass = 'chip-1';
                    else if (lastChip === 5) chipClass = 'chip-5';
                    else if (lastChip === 10) chipClass = 'chip-10';
                    else if (lastChip === 25) chipClass = 'chip-25';
                    else if (lastChip === 100) chipClass = 'chip-100';
                    else if (lastChip === 500) chipClass = 'chip-500';
                    else if (lastChip === 1000) chipClass = 'chip-1000';
                    
                    chip.className = `table-chip ${chipClass}`;
                    chip.textContent = `$${amount}`;
                    
                    // Position chip in the betting area
                    const svgId = idMap[areaId] || areaId;
                    const area = document.getElementById(svgId);
                    
                    if (area) {
                        try {
                            // Use getBoundingClientRect for positioning
                            const areaRect = area.getBoundingClientRect();
                            const svgContainerRect = svgContainer.getBoundingClientRect();
                            
                            // Calculate position relative to svgContainer
                            const left = areaRect.left - svgContainerRect.left + areaRect.width / 2;
                            const top = areaRect.top - svgContainerRect.top + areaRect.height / 2;
                            
                            chip.style.left = left + 'px';
                            chip.style.top = top + 'px';
                            chip.style.transform = 'translate(-50%, -50%)';
                        } catch (e) {
                            // Fallback to center
                            chip.style.left = '425px';
                            chip.style.top = '275px';
                            chip.style.transform = 'translate(-50%, -50%)';
                        }
                    } else {
                        // Fallback to center
                        chip.style.left = '425px';
                        chip.style.top = '275px';
                        chip.style.transform = 'translate(-50%, -50%)';
                    }
                    
                    svgContainer.appendChild(chip);
                }
            });
        }
        
        function updateBalance() {
            balanceEl.textContent = balance;
            const totalBet = Object.values(bets).reduce((sum, amount) => sum + amount, 0);
            totalBetEl.textContent = totalBet;
        }
        
        function rollDice() {
            if (isRolling || Object.keys(bets).length === 0) {
                if (Object.keys(bets).length === 0) {
                    alert('Place a bet first');
                }
                return;
            }
            
            console.log('Starting dice roll...');
            isRolling = true;
            rollBtn.disabled = true;
            clearBtn.disabled = true;
            diceResultEl.textContent = 'Rolling...';
            
            diceCanvasContainer.classList.add('rolling');
            console.log('Dice container class added');
            
            const result1 = Math.floor(Math.random() * 6) + 1;
            const result2 = Math.floor(Math.random() * 6) + 1;
            console.log('Dice results:', result1, result2);
            
            roll3DDice(result1, result2, () => {
                console.log('Dice roll complete');
                diceCanvasContainer.classList.remove('rolling');
                diceResultEl.textContent = `Rolled: ${result1} + ${result2} = ${result1 + result2}`;
                processRoll(result1, result2);
                isRolling = false;
                rollBtn.disabled = false;
                clearBtn.disabled = false;
            });
        }
        
        function processRoll(die1, die2) {
            const total = die1 + die2;
            let winnings = 0;
            
            // Simplified craps rules
            if (total === 7 || total === 11) {
                // Check pass line bets
                if (bets['pass-line']) {
                    winnings += bets['pass-line'] * 2;
                }
                if (bets["don't-pass-bar"]) {
                    winnings += bets["don't-pass-bar"] * 2;
                }
            } else if (total === 2 || total === 3 || total === 12) {
                // Don't pass wins
                if (bets["don't-pass-bar"]) {
                    winnings += bets["don't-pass-bar"] * 2;
                }
            } else {
                // Pass line wins
                if (bets['pass-line']) {
                    winnings += bets['pass-line'] * 2;
                }
            }
            
            // Field bets
            if (bets['field']) {
                if ([2,3,4,9,10,11,12].includes(total)) {
                    winnings += bets['field'] * 2;
                }
            }
            
            // Number bets (single numbers)
            if (bets['4'] && die1 + die2 === 4) winnings += bets['4'] * 7;
            if (bets['5'] && die1 + die2 === 5) winnings += bets['5'] * 7;
            if (bets['six'] && die1 + die2 === 6) winnings += bets['six'] * 7;
            if (bets['8'] && die1 + die2 === 8) winnings += bets['8'] * 7;
            if (bets['nine'] && die1 + die2 === 9) winnings += bets['nine'] * 7;
            if (bets['10'] && die1 + die2 === 10) winnings += bets['10'] * 7;
            
            // Big 6 & 8
            if (bets['big-6-8'] && (die1 + die2 === 6 || die1 + die2 === 8)) winnings += bets['big-6-8'] * 2;
            
            balance += winnings;
            bets = {};
            
            updateBalance();
            renderTableChips();
            
            if (winnings > 0) {
                diceResultEl.textContent += ` - Won $${winnings}!`;
            } else {
                diceResultEl.textContent += ' - House wins';
            }
        }
        
        function clearBets() {
            if (isRolling) return;
            
            // Refund bets
            Object.values(bets).forEach(amount => balance += amount);
            bets = {};
            
            updateBalance();
            renderTableChips();
            diceResultEl.textContent = '';
        }
        
        rollBtn.addEventListener('click', rollDice);
        clearBtn.addEventListener('click', clearBets);
        
        // Initialize dice system
        initDice();
        
        updateBalance();
    </script>
</body>
</html>
